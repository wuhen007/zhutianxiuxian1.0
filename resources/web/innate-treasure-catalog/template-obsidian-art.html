<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>先天至宝图鉴 · 器物立绘版</title>
  <style>
    :root{--bg:#101114;--panel:#191a1f;--line:#3a3b44;--text:#f7f5ee;--muted:#9899a4;--cyan:#6de5dc;--red:#f0786d;--amber:#e9b969}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei",system-ui,sans-serif}
    .app{max-width:1680px;margin:auto;padding:28px clamp(16px,4vw,60px) 52px}
    header{display:flex;justify-content:space-between;align-items:end;gap:18px;padding-bottom:22px;border-bottom:1px solid var(--line)}
    .brand{display:flex;gap:12px;align-items:center}
    .mark{width:32px;height:32px;border:1px solid var(--cyan);color:var(--cyan);display:grid;place-items:center}
    .brand h1{font-size:17px;font-weight:500;margin:0}
    .brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1px;margin-top:4px}
    .status{color:var(--cyan);font-size:11px}
    .hero{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:28px 0 18px;flex-wrap:wrap}
    .hero h2{font-size:30px;font-weight:400;margin:0}
    .hero p{color:var(--muted);font-size:11px;letter-spacing:1px;margin:8px 0 0}
    .code{border:1px solid var(--line);color:var(--amber);padding:10px 12px;font-size:10px}
    .tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-block:1px solid var(--line);padding:12px 0;margin-bottom:20px}
    .chips{display:flex;gap:7px;flex-wrap:wrap}
    .chip{border:1px solid var(--line);background:none;color:var(--muted);padding:7px 10px;font-size:11px}
    .chip.active,.chip:hover{border-color:var(--red);color:var(--text)}
    .search{display:flex;height:35px;border:1px solid var(--line);align-items:center;min-width:min(100%,260px)}
    .search span{color:var(--cyan);padding:0 10px;font-size:17px}
    .search input{width:100%;height:100%;border:0;outline:0;background:none;color:var(--text);font-size:11px}
    .search input::placeholder{color:#6c6d77}
    .result{color:var(--muted);font-size:11px;margin-bottom:12px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .card{background:var(--panel);border:1px solid var(--line);overflow:hidden;transition:transform .2s,border-color .2s}
    .card:hover{transform:translateY(-3px);border-color:var(--cyan)}
    .art{width:100%;aspect-ratio:1;display:block;background:#0c1014;border-bottom:1px solid var(--line);object-fit:cover}
    .body{padding:14px}
    .body h3{font-size:18px;font-weight:500;margin:0}
    .epithet{color:var(--amber);font-size:10px;margin-top:4px}
    .row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:12px}
    .domain{font-size:10px;color:var(--muted)}
    .status-badge{font-size:9px;color:var(--red);border:1px solid var(--red);padding:3px 5px;white-space:nowrap}
    .status-badge.unique{color:var(--amber);border-color:var(--amber)}
    .mini{border-top:1px solid var(--line);padding-top:10px;margin-top:12px;min-height:46px;color:#d4d4d7;font-size:11px;line-height:1.55}
    .open{width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--cyan);text-align:left;padding:11px 0 0;margin-top:12px;font-size:11px}
    .open:hover{color:var(--amber)}
    .empty{grid-column:1/-1;border:1px dashed var(--line);padding:50px;text-align:center;color:var(--muted)}
    .drawer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.74);z-index:3}
    .drawer.open{display:flex;align-items:center;justify-content:center;padding:18px}
    .panel{width:min(740px,100%);max-height:calc(100vh - 36px);overflow:auto;background:var(--panel);border:1px solid var(--cyan);padding:28px}
    .panel-head{display:flex;justify-content:space-between;gap:18px;align-items:start}
    .panel h2{font-size:32px;font-weight:400;margin:0}
    .close{width:34px;height:34px;border:1px solid var(--line);background:none;color:var(--text);font-size:20px}
    .panel-art{width:100%;margin:22px 0;border:1px solid var(--line);background:#0c1014}
    .meta{font-size:12px;color:var(--muted);line-height:1.8}
    .panel h4{font-size:10px;letter-spacing:2px;color:var(--cyan);font-weight:400;margin:22px 0 10px}
    .panel ul{padding-left:18px;font-size:13px;line-height:1.9}
    .command{display:inline-block;border:1px solid #59636a;color:var(--amber);padding:6px 8px;margin:0 6px 6px 0;font-size:11px}
    @media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:820px){header,.hero{align-items:start;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.status{display:none}}
    @media(max-width:520px){.grid{grid-template-columns:1fr}.hero h2{font-size:27px}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><div class="mark">至</div><div><h1>位面至宝图鉴</h1><small>INNATE AUTHORITY / ART PLATES</small></div></div>
      <div class="status">LOCAL ASSETS / 12 FILES</div>
    </header>
    <div class="hero">
      <div><h2>器物立绘版</h2><p>本地 SVG 素材已落入插件目录，可直接替换为 AI PNG。</p></div>
      <div class="code">EVENT / TREASURE_APPEAR</div>
    </div>
    <div class="tools">
      <div class="chips">
        <button class="chip active" data-filter="all">全部</button>
        <button class="chip" data-filter="可争夺">可争夺</button>
        <button class="chip" data-filter="传承唯一">传承唯一</button>
      </div>
      <label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索名称或效果" aria-label="搜索至宝"></label>
    </div>
    <div class="result" id="result"></div>
    <section class="grid" id="grid"></section>
  </div>

  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="panel-head">
        <div><h2 id="drawer-title"></h2><div class="epithet" id="drawer-epithet"></div></div>
        <button class="close" id="close" aria-label="关闭详情">×</button>
      </div>
      <img class="panel-art" id="drawer-art" alt="">
      <div class="meta" id="drawer-meta"></div>
      <h4>权柄效果</h4>
      <ul id="drawer-effects"></ul>
      <h4>落地指令</h4>
      <div id="drawer-commands"></div>
      <h4>档案备注</h4>
      <p class="meta" id="drawer-lore"></p>
    </div>
  </div>

  <script src="./treasure-data.js"></script>
  <script>
    const data = window.TREASURE_DATA;
    const grid = document.querySelector('#grid');
    const result = document.querySelector('#result');
    const state = { filter: 'all', query: '' };
    const esc = value => String(value).replace(/[&<>\"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch]));

    function assetPath(item) {
      return `./assets/${item.id}.svg`;
    }

    function render() {
      const q = state.query.toLowerCase();
      const items = data.filter(item => (state.filter === 'all' || item.status === state.filter) && (!q || [item.name, item.epithet, item.domain, item.lore, ...item.effects].join(' ').toLowerCase().includes(q)));
      result.textContent = `显示 ${items.length} 件至宝`;
      grid.innerHTML = items.length ? items.map((item, index) => `
        <article class="card">
          <img class="art" src="${assetPath(item)}" alt="${esc(item.name)}图像">
          <div class="body">
            <h3>${esc(item.name)}</h3>
            <div class="epithet">${esc(item.epithet)}</div>
            <div class="row">
              <span class="domain">${esc(item.domain)} · ${esc(item.cooldown)}</span>
              <span class="status-badge ${item.status === '传承唯一' ? 'unique' : ''}">${esc(item.status)}</span>
            </div>
            <div class="mini">${esc(item.effects[0])}</div>
            <button class="open" data-open="${item.id}">打开权柄档案 →</button>
          </div>
        </article>
      `).join('') : '<div class="empty">没有符合当前筛选的至宝</div>';
      grid.querySelectorAll('[data-open]').forEach(button => button.addEventListener('click', () => openDrawer(button.dataset.open)));
    }

    function openDrawer(id) {
      const item = data.find(entry => entry.id === id);
      if (!item) return;
      document.querySelector('#drawer-title').textContent = item.name;
      document.querySelector('#drawer-epithet').textContent = item.epithet;
      document.querySelector('#drawer-art').src = assetPath(item);
      document.querySelector('#drawer-art').alt = item.name + '图像';
      document.querySelector('#drawer-meta').textContent = `${item.status} · ${item.domain}权柄 · 冷却 ${item.cooldown} · 代价：${item.cost}`;
      document.querySelector('#drawer-effects').innerHTML = item.effects.map(effect => `<li>${esc(effect)}</li>`).join('');
      document.querySelector('#drawer-commands').innerHTML = item.commands.map(command => `<span class="command">${esc(command)}</span>`).join('');
      document.querySelector('#drawer-lore').textContent = item.lore;
      document.querySelector('#drawer').classList.add('open');
      document.querySelector('#drawer').setAttribute('aria-hidden', 'false');
    }

    function closeDrawer() {
      document.querySelector('#drawer').classList.remove('open');
      document.querySelector('#drawer').setAttribute('aria-hidden', 'true');
    }

    document.querySelector('#search').addEventListener('input', event => { state.query = event.target.value.trim(); render(); });
    document.querySelectorAll('[data-filter]').forEach(button => button.addEventListener('click', () => {
      state.filter = button.dataset.filter;
      document.querySelectorAll('.chip').forEach(item => item.classList.toggle('active', item === button));
      render();
    }));
    document.querySelector('#close').addEventListener('click', closeDrawer);
    document.querySelector('#drawer').addEventListener('click', event => { if (event.target.id === 'drawer') closeDrawer(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeDrawer(); });
    render();
  </script>
</body>
</html>
