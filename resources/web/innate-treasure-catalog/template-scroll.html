<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>先天至宝图鉴 · 仙录卷轴</title>
  <style>
    :root{--paper:#e6eee7;--paper2:#d9e5dc;--ink:#192a27;--muted:#60736d;--line:#aebfb3;--green:#1e5147;--copper:#a74a35;--yellow:#c49132}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif;letter-spacing:0}.page{max-width:1440px;margin:auto;padding:28px clamp(16px,5vw,78px) 52px}
    header{display:flex;justify-content:space-between;gap:28px;align-items:end;padding-bottom:26px;border-bottom:2px solid var(--green)}.kicker{font-size:11px;color:var(--copper);letter-spacing:3px;margin-bottom:11px}.title{font-family:Georgia,"Microsoft YaHei",serif;font-weight:400;font-size:clamp(34px,5vw,66px);line-height:1;margin:0}.subtitle{font-size:13px;color:var(--muted);margin:14px 0 0}.stamp{width:86px;height:86px;border:2px solid var(--copper);color:var(--copper);display:grid;place-items:center;border-radius:50%;font-family:Georgia,serif;font-size:28px;transform:rotate(-9deg);flex:0 0 auto}.stamp small{font-family:inherit;font-size:10px;display:block;text-align:center;line-height:1.2}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin:28px 0}.summary div{background:var(--paper2);padding:16px 18px}.summary b{font-family:Georgia,serif;font-size:29px;font-weight:400;color:var(--green);display:block}.summary span{font-size:11px;color:var(--muted)}
    .toolbar{display:flex;align-items:center;gap:14px;justify-content:space-between;margin:30px 0 16px;flex-wrap:wrap}.tabs{display:flex;gap:0;border-bottom:1px solid var(--line)}.tab{border:0;background:none;color:var(--muted);padding:10px 14px;font-size:12px;border-bottom:2px solid transparent;margin-bottom:-1px}.tab:hover,.tab.active{color:var(--green);border-bottom-color:var(--copper)}.search{height:38px;display:flex;align-items:center;border:1px solid var(--line);background:#eef4ef;min-width:min(100%,280px)}.search span{padding:0 11px;color:var(--copper);font-size:18px}.search input{border:0;outline:0;background:transparent;color:var(--ink);width:100%;font-size:12px}.search input::placeholder{color:#81918b}.result{font-size:12px;color:var(--muted)}
    .content{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:34px}.list{display:grid;gap:12px}.entry{display:grid;grid-template-columns:190px minmax(0,1fr) 120px;gap:20px;align-items:stretch;border:1px solid var(--line);background:#edf4ee;padding:12px;transition:border-color .2s,transform .2s}.entry:hover{border-color:var(--copper);transform:translateX(3px)}.entry-art{width:100%;height:100%;min-height:126px;object-fit:cover;background:#11171c}.entry-copy{padding:5px 0}.entry-title{display:flex;align-items:start;gap:12px;justify-content:space-between}.entry h2{font-family:Georgia,"Microsoft YaHei",serif;font-size:24px;font-weight:400;margin:0}.epithet{font-size:11px;color:var(--copper);margin:5px 0 14px}.domain{font-size:11px;color:var(--green);letter-spacing:1px}.lore{font-size:12px;line-height:1.7;color:var(--muted);margin:9px 0 0}.entry-side{border-left:1px solid var(--line);padding:9px 0 9px 15px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start}.entry-side b{font-family:Georgia,serif;font-weight:400;color:var(--green);font-size:13px}.status{font-size:10px;color:var(--copper);border:1px solid var(--copper);padding:4px 6px}.open{border:0;background:none;color:var(--copper);padding:0;font-size:12px}.open:hover{color:var(--green)}
    .rail{border-left:1px solid var(--line);padding-left:22px}.rail h3{font-family:Georgia,serif;font-size:22px;font-weight:400;margin:3px 0 8px;color:var(--green)}.rail p{font-size:12px;line-height:1.8;color:var(--muted);margin:0}.rail-line{height:1px;background:var(--line);margin:22px 0}.rail ul{padding-left:17px;margin:0;color:var(--muted);font-size:12px;line-height:2}.rail strong{color:var(--copper);font-weight:500}.empty{border:1px dashed var(--line);padding:54px 20px;text-align:center;color:var(--muted);font-size:12px}
    .drawer{position:fixed;inset:0;display:none;background:rgba(25,42,39,.52);z-index:4}.drawer.is-open{display:flex;align-items:center;justify-content:center;padding:18px}.panel{width:min(700px,100%);max-height:calc(100vh - 36px);overflow:auto;background:var(--paper);border:2px solid var(--green);padding:28px}.panel-head{display:flex;justify-content:space-between;gap:16px;align-items:start}.panel h2{font-family:Georgia,"Microsoft YaHei",serif;font-size:34px;font-weight:400;margin:0}.panel .epithet{font-size:13px}.close{border:1px solid var(--green);color:var(--green);background:none;width:34px;height:34px;font-size:20px}.panel-art{width:100%;max-height:250px;object-fit:cover;margin:22px 0 20px;border:1px solid var(--line)}.meta{font-size:12px;color:var(--muted);line-height:1.8}.panel h3{font-family:Georgia,serif;font-size:18px;font-weight:400;color:var(--green);margin:22px 0 8px}.panel ul{padding-left:18px;color:var(--ink);font-size:13px;line-height:1.9}.command{display:inline-block;color:var(--copper);border-bottom:1px solid var(--copper);padding:4px 0;margin:0 12px 6px 0;font-size:12px}
    @media(max-width:900px){.content{grid-template-columns:1fr}.rail{display:none}.entry{grid-template-columns:155px minmax(0,1fr)}}@media(max-width:620px){.page{padding:20px 14px 38px}header{align-items:start}.stamp{width:62px;height:62px;font-size:19px}.stamp small{font-size:8px}.summary{margin-top:20px}.summary div{padding:12px}.summary b{font-size:23px}.entry{grid-template-columns:1fr;gap:12px}.entry-art{height:auto;aspect-ratio:1.7}.entry-side{border-left:0;border-top:1px solid var(--line);padding:11px 0 0;display:flex;flex-direction:row;align-items:center}.toolbar{align-items:stretch}.tabs{overflow:auto;max-width:100%}.search{width:100%}}
  </style>
</head>
<body>
  <div class="page">
    <header><div><div class="kicker">诸天仙录 · 卷七</div><h1 class="title">先天至宝图鉴</h1><p class="subtitle">把权柄、代价与传承写在同一页上</p></div><div class="stamp"><div>仙<br><small>录</small></div></div></header>
    <div class="summary"><div><b id="count">12</b><span>已显化名录</span></div><div><b id="contestable">11</b><span>仍可争夺</span></div><div><b>∞</b><span>传承因果未尽</span></div></div>
    <div class="toolbar"><div class="tabs"><button class="tab active" data-filter="all">全部</button><button class="tab" data-filter="可争夺">可争夺</button><button class="tab" data-filter="传承唯一">传承唯一</button></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="查找至宝或权柄" aria-label="搜索至宝"></label></div>
    <div class="content"><main><div class="result" id="result">显示 12 件至宝</div><section class="list" id="list" aria-live="polite"></section></main><aside class="rail"><h3>阅览札记</h3><p>至宝不是装备栏里的静物。每一件都绑定位面坐标、执掌资格与冷却秩序。</p><div class="rail-line"></div><ul><li><strong>可争夺</strong>：事件或天机显化仍可能指向</li><li><strong>传承唯一</strong>：只保留一份正统传承</li><li><strong>权柄</strong>：用指令把效果落到玩法</li></ul><div class="rail-line"></div><p>本卷图像为本地生成的档案插画，打开文件即可阅览。</p></aside></div>
  </div>
  <div class="drawer" id="drawer" aria-hidden="true"><div class="panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="panel-head"><div><h2 id="drawer-title"></h2><div class="epithet" id="drawer-epithet"></div></div><button class="close" id="close" aria-label="关闭详情">×</button></div><img class="panel-art" id="drawer-art" alt=""><div class="meta" id="drawer-meta"></div><h3>权柄效果</h3><ul id="drawer-effects"></ul><h3>可用指令</h3><div id="drawer-commands"></div><h3>档案原文</h3><p class="meta" id="drawer-lore"></p></div></div>
  <script src="./treasure-data.js"></script><script src="./treasure-assets.js"></script>
  <script>
    const data=window.TREASURE_DATA,list=document.querySelector('#list'),result=document.querySelector('#result'),state={filter:'all',query:''};
    const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function render(){const q=state.query.toLowerCase();const items=data.filter(item=>(state.filter==='all'||item.status===state.filter)&&(!q||[item.name,item.epithet,item.domain,item.lore,...item.effects].join(' ').toLowerCase().includes(q)));result.textContent=`显示 ${items.length} 件至宝`;list.innerHTML=items.length?items.map(item=>`<article class="entry"><img class="entry-art" src="${window.TREASURE_ART(item)}" alt="${esc(item.name)}图像"><div class="entry-copy"><div class="entry-title"><div><h2>${esc(item.name)}</h2><div class="epithet">${esc(item.epithet)}</div></div><span class="domain">${esc(item.domain)}</span></div><p class="lore">${esc(item.lore)}</p></div><div class="entry-side"><span class="status">${esc(item.status)}</span><b>${esc(item.cooldown)}</b><button class="open" data-open="${item.id}">阅览 →</button></div></article>`).join(''):'<div class="empty">卷中没有找到对应至宝</div>';list.querySelectorAll('[data-open]').forEach(button=>button.addEventListener('click',()=>openDrawer(button.dataset.open)))}
    function openDrawer(id){const item=data.find(entry=>entry.id===id);if(!item)return;document.querySelector('#drawer-title').textContent=item.name;document.querySelector('#drawer-epithet').textContent=item.epithet;document.querySelector('#drawer-art').src=window.TREASURE_ART(item);document.querySelector('#drawer-art').alt=item.name+'图像';document.querySelector('#drawer-meta').textContent=`${item.status} · ${item.domain}权柄 · 冷却 ${item.cooldown} · 代价：${item.cost}`;document.querySelector('#drawer-effects').innerHTML=item.effects.map(effect=>`<li>${esc(effect)}</li>`).join('');document.querySelector('#drawer-commands').innerHTML=item.commands.map(command=>`<span class="command">${esc(command)}</span>`).join('');document.querySelector('#drawer-lore').textContent=item.lore;document.querySelector('#drawer').classList.add('is-open');document.querySelector('#drawer').setAttribute('aria-hidden','false')}
    function closeDrawer(){document.querySelector('#drawer').classList.remove('is-open');document.querySelector('#drawer').setAttribute('aria-hidden','true')}
    document.querySelector('#search').addEventListener('input',event=>{state.query=event.target.value.trim();render()});document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{state.filter=button.dataset.filter;document.querySelectorAll('.tab').forEach(item=>item.classList.remove('active'));button.classList.add('active');render()}));document.querySelector('#close').addEventListener('click',closeDrawer);document.querySelector('#drawer').addEventListener('click',event=>{if(event.target.id==='drawer')closeDrawer()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDrawer()});render();
  </script>
</body>
</html>
