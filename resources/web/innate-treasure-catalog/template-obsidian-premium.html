<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>先天至宝图鉴 · Premium Plates</title><style>
:root{--bg:#101114;--panel:#191a1f;--line:#3a3b44;--text:#f7f5ee;--muted:#9899a4;--cyan:#6de5dc;--red:#f0786d;--amber:#e9b969}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei",system-ui,sans-serif}.app{max-width:1560px;margin:auto;padding:28px clamp(16px,4vw,60px) 50px}.top{border-bottom:1px solid var(--line);padding-bottom:22px;display:flex;justify-content:space-between;align-items:end;gap:18px}.brand{display:flex;gap:12px;align-items:center}.mark{width:32px;height:32px;border:1px solid var(--cyan);color:var(--cyan);display:grid;place-items:center}.brand h1{font-size:17px;font-weight:500;margin:0}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:4px}.meta{color:var(--cyan);font-size:11px}.heading{display:flex;justify-content:space-between;align-items:end;margin:30px 0 20px;gap:18px}.heading h2{font-size:31px;font-weight:400;margin:0}.heading p{color:var(--muted);font-size:11px;letter-spacing:1px;margin:8px 0 0}.code{border:1px solid var(--line);color:var(--amber);padding:10px 12px;font-size:10px}.tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-block:1px solid var(--line);padding:12px 0;margin-bottom:20px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:none;color:var(--muted);padding:7px 10px;font-size:11px}.chip.active,.chip:hover{border-color:var(--red);color:var(--text)}.search{display:flex;height:35px;border:1px solid var(--line);align-items:center;min-width:min(100%,260px)}.search span{color:var(--cyan);padding:0 10px;font-size:17px}.search input{width:100%;height:100%;border:0;outline:0;background:none;color:var(--text);font-size:11px}.search input::placeholder{color:#6c6d77}.result{color:var(--muted);font-size:11px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.card{background:var(--panel);border:1px solid var(--line);overflow:hidden;position:relative;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-3px);border-color:var(--cyan)}.art{width:100%;display:block;aspect-ratio:1.48;background:#0c1014;border-bottom:1px solid var(--line)}.index{position:absolute;left:8px;top:8px;padding:4px 6px;background:#101114dd;color:var(--cyan);font-size:10px}.body{padding:13px}.body h3{font-size:17px;font-weight:500;margin:0}.epithet{color:var(--amber);font-size:10px;margin-top:5px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:13px}.domain{font-size:10px;color:var(--muted)}.status{font-size:9px;color:var(--red);border:1px solid var(--red);padding:3px 5px}.status.unique{color:var(--amber);border-color:var(--amber)}.mini{border-top:1px solid var(--line);padding-top:10px;margin-top:11px;min-height:43px;color:#d4d4d7;font-size:11px;line-height:1.55}.empty{grid-column:1/-1;border:1px dashed var(--line);padding:50px;text-align:center;color:var(--muted)}@media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:720px){.top,.heading{align-items:start;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.meta{display:none}}@media(max-width:480px){.grid{grid-template-columns:1fr}.heading h2{font-size:27px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="mark">至</div><div><h1>位面至宝图鉴</h1><small>INNATE AUTHORITY / PREMIUM PLATES</small></div></div><div class="meta">LOCAL ARTWORK · 12 PLATES</div></header><section class="heading"><div><h2>权柄控制台</h2><p>INSTANCE 01 · TREASURE AUTHORITY REGISTER</p></div><div class="code">EVENT / TREASURE_APPEAR</div></section><div class="tools"><div class="chips"><button class="chip active" data-filter="all">全部</button><button class="chip" data-filter="可争夺">可争夺</button><button class="chip" data-filter="传承唯一">传承唯一</button></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索名称或效果" aria-label="搜索至宝"></label></div><div class="result" id="result"></div><section class="grid" id="grid"></section></div><script src="./treasure-data.js"></script><script src="./treasure-assets-premium.js"></script><script>
const data=window.TREASURE_DATA,grid=document.querySelector('#grid'),result=document.querySelector('#result'),state={filter:'all',query:''};const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=state.query.toLowerCase(),items=data.filter(i=>(state.filter==='all'||i.status===state.filter)&&(!q||[i.name,i.epithet,i.domain,i.lore,...i.effects].join(' ').toLowerCase().includes(q)));result.textContent=`显示 ${items.length} 件至宝`;grid.innerHTML=items.length?items.map((i,n)=>`<article class="card"><span class="index">${String(n+1).padStart(2,'0')}</span><img class="art" src="${window.TREASURE_ART(i)}" alt="${esc(i.name)}图像"><div class="body"><h3>${esc(i.name)}</h3><div class="epithet">${esc(i.epithet)}</div><div class="row"><span class="domain">${esc(i.domain)} · ${esc(i.cooldown)}</span><span class="status ${i.status==='传承唯一'?'unique':''}">${esc(i.status)}</span></div><div class="mini">${esc(i.effects[0])}</div></div></article>`).join(''):'<div class="empty">没有符合当前筛选的至宝</div>'}document.querySelector('#search').oninput=e=>{state.query=e.target.value.trim();render()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});render();
</script></body></html>
