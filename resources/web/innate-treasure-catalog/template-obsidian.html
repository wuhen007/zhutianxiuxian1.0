<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>先天至宝图鉴 · 权柄控制台</title>
  <style>
    :root{--black:#111114;--black2:#19191d;--line:#34343b;--paper:#f7f5ee;--muted:#9999a4;--red:#f06f63;--cyan:#6de5dc;--amber:#e6b667}
    *{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--paper);font-family:"Microsoft YaHei",system-ui,sans-serif;letter-spacing:0}.app{min-height:100vh;max-width:1700px;margin:auto}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3vw,48px);gap:20px}.brand{display:flex;align-items:center;gap:13px}.brand-mark{width:30px;height:30px;border:1px solid var(--cyan);color:var(--cyan);display:grid;place-items:center;font-size:13px}.brand h1{font-size:16px;font-weight:500;margin:0}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.top-actions{display:flex;align-items:center;gap:18px;color:var(--muted);font-size:11px}.pulse{display:inline-flex;align-items:center;gap:7px;color:var(--cyan)}.pulse i{width:7px;height:7px;background:var(--cyan);display:inline-block;border-radius:50%}
    .layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 76px)}.nav{border-right:1px solid var(--line);padding:28px 22px}.nav-title{font-size:10px;color:var(--muted);letter-spacing:2px;margin:0 0 16px}.nav-btn{width:100%;border:1px solid transparent;background:none;color:var(--muted);padding:12px 12px;text-align:left;font-size:12px;display:flex;justify-content:space-between;margin-bottom:4px}.nav-btn:hover,.nav-btn.active{border-color:var(--cyan);color:var(--paper);background:var(--black2)}.nav-btn em{font-style:normal;color:var(--muted);font-size:10px}.nav-note{border-top:1px solid var(--line);margin-top:28px;padding-top:18px;color:var(--muted);font-size:11px;line-height:1.7}.nav-note b{display:block;color:var(--amber);font-size:19px;font-weight:500;margin-bottom:4px}
    main{padding:28px clamp(16px,3vw,48px);min-width:0}.headline{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:26px}.headline h2{font-size:30px;font-weight:400;margin:0}.headline p{color:var(--muted);font-size:12px;margin:9px 0 0}.headline-code{border:1px solid var(--line);padding:11px 13px;color:var(--amber);font-size:11px;white-space:nowrap}.controls{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:none;color:var(--muted);padding:7px 10px;font-size:11px}.chip:hover,.chip.active{border-color:var(--red);color:var(--paper)}.search{height:34px;display:flex;align-items:center;border:1px solid var(--line);min-width:min(100%,260px)}.search span{color:var(--cyan);padding:0 10px;font-size:17px}.search input{border:0;outline:0;background:transparent;color:var(--paper);width:100%;font-size:11px}.search input::placeholder{color:#696972}.result{color:var(--muted);font-size:11px;margin-bottom:12px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.card{background:var(--black2);border:1px solid var(--line);position:relative;overflow:hidden;transition:border-color .2s}.card:hover{border-color:var(--cyan)}.art{display:block;width:100%;aspect-ratio:1.28;object-fit:cover;background:#11171c;border-bottom:1px solid var(--line)}.card-content{padding:13px}.index{position:absolute;top:8px;left:8px;background:var(--black);color:var(--cyan);padding:4px 6px;font-size:10px}.card h3{font-size:17px;font-weight:500;margin:0}.epithet{color:var(--amber);font-size:10px;margin-top:5px}.card-row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:14px}.domain{font-size:10px;color:var(--muted)}.status{font-size:9px;color:var(--red);border:1px solid var(--red);padding:3px 5px}.status.unique{color:var(--amber);border-color:var(--amber)}.mini{font-size:11px;color:#d4d4d7;line-height:1.55;border-top:1px solid var(--line);padding-top:10px;margin-top:12px;min-height:43px}.open{display:block;width:100%;border:0;background:none;border-top:1px solid var(--line);color:var(--cyan);text-align:left;padding:11px 0 0;margin-top:12px;font-size:11px}.open:hover{color:var(--amber)}.empty{grid-column:1/-1;border:1px dashed var(--line);padding:60px;text-align:center;color:var(--muted);font-size:12px}
    .drawer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:5}.drawer.is-open{display:flex;align-items:center;justify-content:center;padding:18px}.panel{width:min(720px,100%);max-height:calc(100vh - 36px);overflow:auto;background:var(--black2);border:1px solid var(--cyan);padding:28px}.panel-head{display:flex;justify-content:space-between;gap:16px;align-items:start}.panel h2{font-size:32px;font-weight:400;margin:0}.panel .epithet{font-size:12px}.close{border:1px solid var(--line);background:none;color:var(--paper);width:34px;height:34px;font-size:20px}.panel-art{width:100%;margin:22px 0;border:1px solid var(--line)}.meta{font-size:12px;color:var(--muted);line-height:1.8}.panel h4{font-size:10px;letter-spacing:2px;color:var(--cyan);font-weight:400;margin:22px 0 10px}.panel ul{padding-left:18px;line-height:1.9;font-size:13px}.command{display:inline-block;border:1px solid #59636a;color:var(--amber);padding:6px 8px;margin:0 6px 6px 0;font-size:11px}
    @media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:820px){.layout{grid-template-columns:1fr}.nav{border-right:0;border-bottom:1px solid var(--line);padding:16px}.nav-btn{display:inline-flex;width:auto;margin:0 4px 4px 0;gap:20px}.nav-note{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.headline{align-items:start;flex-direction:column}}@media(max-width:520px){.topbar{height:auto;min-height:70px;padding:15px 16px}.top-actions{display:none}.grid{grid-template-columns:1fr}.headline h2{font-size:27px}.headline-code{white-space:normal}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar"><div class="brand"><div class="brand-mark">至</div><div><h1>位面至宝图鉴</h1><small>INNATE AUTHORITY / CONTROL DESK</small></div></div><div class="top-actions"><span class="pulse"><i></i>位面事件监听中</span><span>最后同步：刚刚</span></div></header>
    <div class="layout"><nav class="nav"><p class="nav-title">档案分组</p><button class="nav-btn active" data-filter="all">全部至宝<em>12</em></button><button class="nav-btn" data-filter="可争夺">事件可争夺<em>11</em></button><button class="nav-btn" data-filter="传承唯一">唯一传承<em>01</em></button><p class="nav-title" style="margin-top:28px">运行标签</p><button class="nav-btn" data-domain="战斗">战斗与讨伐</button><button class="nav-btn" data-domain="洞天">洞天与收益</button><button class="nav-btn" data-domain="修行">修行与轮回</button><div class="nav-note"><b>至宝槽独立</b>先天至宝不占帝兵栏。事件、天机显化与认主状态以位面为单位记录。</div></nav>
      <main><div class="headline"><div><h2>权柄控制台</h2><p>用一眼能读懂的方式查看效果、冷却和落地指令。</p></div><div class="headline-code">EVENT / TREASURE_APPEAR</div></div><div class="controls"><div class="chips"><button class="chip active" data-filter="all">全部</button><button class="chip" data-filter="可争夺">可争夺</button><button class="chip" data-filter="传承唯一">传承唯一</button></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索名称或效果" aria-label="搜索至宝"></label></div><div class="result" id="result">显示 12 件至宝</div><section class="grid" id="grid" aria-live="polite"></section></main>
    </div>
  </div>
  <div class="drawer" id="drawer" aria-hidden="true"><div class="panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="panel-head"><div><h2 id="drawer-title"></h2><div class="epithet" id="drawer-epithet"></div></div><button class="close" id="close" aria-label="关闭详情">×</button></div><img class="panel-art" id="drawer-art" alt=""><div class="meta" id="drawer-meta"></div><h4>权柄效果</h4><ul id="drawer-effects"></ul><h4>落地指令</h4><div id="drawer-commands"></div><h4>档案备注</h4><p class="meta" id="drawer-lore"></p></div></div>
  <script src="./treasure-data.js"></script><script src="./treasure-assets.js"></script>
  <script>
    const data=window.TREASURE_DATA,grid=document.querySelector('#grid'),result=document.querySelector('#result'),state={filter:'all',domain:'',query:''};
    const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function render(){const q=state.query.toLowerCase();const items=data.filter(item=>(state.filter==='all'||item.status===state.filter)&&(!state.domain||item.domain===state.domain)&&(!q||[item.name,item.epithet,item.domain,item.lore,...item.effects].join(' ').toLowerCase().includes(q)));result.textContent=`显示 ${items.length} 件至宝`;grid.innerHTML=items.length?items.map((item,index)=>`<article class="card"><span class="index">${String(index+1).padStart(2,'0')}</span><img class="art" src="${window.TREASURE_ART(item)}" alt="${esc(item.name)}图像"><div class="card-content"><h3>${esc(item.name)}</h3><div class="epithet">${esc(item.epithet)}</div><div class="card-row"><span class="domain">${esc(item.domain)} · ${esc(item.cooldown)}</span><span class="status ${item.status==='传承唯一'?'unique':''}">${esc(item.status)}</span></div><div class="mini">${esc(item.effects[0])}</div><button class="open" data-open="${item.id}">打开权柄档案 →</button></div></article>`).join(''):'<div class="empty">没有符合当前筛选的至宝</div>';grid.querySelectorAll('[data-open]').forEach(button=>button.addEventListener('click',()=>openDrawer(button.dataset.open)))}
    function openDrawer(id){const item=data.find(entry=>entry.id===id);if(!item)return;document.querySelector('#drawer-title').textContent=item.name;document.querySelector('#drawer-epithet').textContent=item.epithet;document.querySelector('#drawer-art').src=window.TREASURE_ART(item);document.querySelector('#drawer-art').alt=item.name+'图像';document.querySelector('#drawer-meta').textContent=`${item.status} · ${item.domain}权柄 · 冷却 ${item.cooldown} · 代价：${item.cost}`;document.querySelector('#drawer-effects').innerHTML=item.effects.map(effect=>`<li>${esc(effect)}</li>`).join('');document.querySelector('#drawer-commands').innerHTML=item.commands.map(command=>`<span class="command">${esc(command)}</span>`).join('');document.querySelector('#drawer-lore').textContent=item.lore;document.querySelector('#drawer').classList.add('is-open');document.querySelector('#drawer').setAttribute('aria-hidden','false')}
    function closeDrawer(){document.querySelector('#drawer').classList.remove('is-open');document.querySelector('#drawer').setAttribute('aria-hidden','true')}
    document.querySelector('#search').addEventListener('input',event=>{state.query=event.target.value.trim();render()});document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{state.filter=button.dataset.filter;state.domain='';document.querySelectorAll('.nav-btn,.chip').forEach(item=>item.classList.remove('active'));document.querySelectorAll(`[data-filter="${state.filter}"]`).forEach(item=>item.classList.add('active'));render()}));document.querySelectorAll('[data-domain]').forEach(button=>button.addEventListener('click',()=>{state.domain=state.domain===button.dataset.domain?'':button.dataset.domain;state.filter='all';document.querySelectorAll('.nav-btn,.chip').forEach(item=>item.classList.remove('active'));button.classList.toggle('active',!!state.domain);document.querySelectorAll('[data-filter="all"]').forEach(item=>item.classList.toggle('active',!state.domain));render()}));document.querySelector('#close').addEventListener('click',closeDrawer);document.querySelector('#drawer').addEventListener('click',event=>{if(event.target.id==='drawer')closeDrawer()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDrawer()});render();
  </script>
</body>
</html>
