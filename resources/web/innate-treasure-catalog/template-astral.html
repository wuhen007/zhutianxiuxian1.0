<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>先天至宝图鉴 · 星海档案馆</title>
  <style>
    :root{--ink:#edf2f5;--muted:#8f9ca3;--line:#26343b;--panel:#121c22;--panel2:#17242b;--teal:#72e0c2;--gold:#f0c875;--red:#ff776b}
    *{box-sizing:border-box} body{margin:0;background:#0a0f13;color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif;letter-spacing:0}
    button,input{font:inherit} button{cursor:pointer} .shell{min-height:100vh;max-width:1600px;margin:auto}
    header{border-bottom:1px solid var(--line);padding:28px clamp(18px,4vw,64px) 24px;display:flex;gap:26px;align-items:end;justify-content:space-between}
    .kicker{font-size:11px;letter-spacing:2px;color:var(--teal);text-transform:uppercase;margin-bottom:10px}.title{margin:0;font-size:clamp(30px,4vw,58px);font-weight:500;line-height:1.05}.subtitle{margin:12px 0 0;color:var(--muted);font-size:14px}.seal{width:72px;height:72px;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;transform:rotate(45deg);flex:0 0 auto}.seal span{transform:rotate(-45deg);font-size:26px}
    .stats{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:96px;border-left:1px solid var(--line);padding-left:14px}.stat b{display:block;font-size:22px;font-weight:500;color:var(--gold)}.stat small{color:var(--muted);font-size:11px}
    .workspace{display:grid;grid-template-columns:230px 1fr;gap:30px;padding:30px clamp(18px,4vw,64px)}
    aside{border-right:1px solid var(--line);padding-right:24px}.aside-label{color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin:4px 0 12px}.filter{display:flex;width:100%;align-items:center;justify-content:space-between;border:0;border-bottom:1px solid var(--line);background:none;color:var(--muted);padding:12px 0;text-align:left}.filter:hover,.filter.active{color:var(--teal)}.filter span{font-size:11px;color:#5e6d75}.legend{border-top:1px solid var(--line);margin-top:26px;padding-top:20px;color:var(--muted);font-size:12px;line-height:1.7}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-right:7px}.dot.gold{background:var(--gold)}
    main{min-width:0}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap}.result{color:var(--muted);font-size:13px}.search{display:flex;align-items:center;border:1px solid var(--line);background:var(--panel);min-width:min(100%,300px);height:40px}.search span{color:var(--teal);padding:0 12px;font-size:19px}.search input{border:0;outline:0;background:transparent;color:var(--ink);width:100%;height:100%;font-size:13px}.search input::placeholder{color:#68777d}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{border:1px solid var(--line);background:var(--panel);transition:border-color .2s,transform .2s;overflow:hidden}.card:hover{border-color:var(--teal);transform:translateY(-3px)}.art{width:100%;aspect-ratio:1.48;display:block;background:#11171c}.card-body{padding:17px 17px 16px}.card-top{display:flex;align-items:start;justify-content:space-between;gap:10px}.card h2{font-size:20px;font-weight:500;margin:0;line-height:1.25}.epithet{color:var(--gold);font-size:11px;margin-top:5px}.badge{font-size:10px;border:1px solid #53646d;color:var(--muted);padding:4px 6px;white-space:nowrap}.badge.unique{border-color:var(--gold);color:var(--gold)}.domain{display:inline-block;margin:17px 0 10px;color:var(--teal);font-size:11px}.lore{font-size:12px;line-height:1.65;color:#afbcc1;min-height:40px;margin:0}.effect-line{border-top:1px solid var(--line);margin-top:16px;padding-top:12px;color:#e5ecef;font-size:12px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.open{margin-top:15px;border:0;border-top:1px solid var(--line);background:none;color:var(--teal);padding:12px 0 0;font-size:12px;width:100%;text-align:left}.open:hover{color:var(--gold)}
    .empty{grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line)}
    .drawer{position:fixed;inset:0;display:none;background:rgba(5,9,12,.76);z-index:4}.drawer.is-open{display:flex;justify-content:flex-end}.drawer-panel{height:100%;width:min(560px,100%);background:#10191f;border-left:1px solid var(--teal);padding:28px clamp(20px,4vw,42px);overflow:auto}.drawer-head{display:flex;align-items:start;justify-content:space-between;gap:18px}.drawer h2{font-size:32px;font-weight:500;margin:0}.drawer .epithet{font-size:13px}.close{border:1px solid var(--line);background:none;color:var(--ink);width:36px;height:36px;font-size:22px}.drawer-art{width:100%;margin:28px 0 24px;border:1px solid var(--line)}.drawer h3{font-size:11px;letter-spacing:1.5px;color:var(--teal);font-weight:400;margin:24px 0 10px}.drawer ul{padding-left:18px;color:#d8e2e5;font-size:13px;line-height:1.9}.command{display:inline-block;border:1px solid #3c555d;color:var(--gold);padding:7px 9px;margin:0 6px 7px 0;font-size:12px;background:#132229}.meta{color:var(--muted);font-size:12px;line-height:1.7}
    @media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.workspace{grid-template-columns:190px 1fr;gap:22px}}
    @media(max-width:680px){header{align-items:start;flex-direction:column}.stats{justify-content:start}.workspace{display:block;padding-top:22px}aside{border-right:0;border-bottom:1px solid var(--line);padding:0 0 16px;margin-bottom:22px}.filter{display:inline-flex;width:auto;gap:18px;border:1px solid var(--line);padding:8px 10px;margin:0 5px 5px 0}.legend{display:none}.grid{grid-template-columns:1fr}.title{font-size:36px}}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div><div class="kicker">Plane relic archive / 01</div><h1 class="title">先天至宝图鉴</h1><p class="subtitle">星海档案馆 · 独立至宝执掌记录</p></div>
      <div class="stats"><div class="stat"><b id="count">12</b><small>收录至宝</small></div><div class="stat"><b id="contestable">11</b><small>可争夺</small></div><div class="stat"><b>24h</b><small>最长权柄冷却</small></div><div class="seal"><span>宝</span></div></div>
    </header>
    <div class="workspace">
      <aside><div class="aside-label">检索档案</div><button class="filter active" data-filter="all">全部<span>12</span></button><button class="filter" data-filter="可争夺">可争夺<span>11</span></button><button class="filter" data-filter="传承唯一">传承唯一<span>01</span></button><div class="aside-label" style="margin-top:28px">权柄索引</div><button class="filter" data-domain="战斗">战斗权柄</button><button class="filter" data-domain="洞天">洞天权柄</button><button class="filter" data-domain="修行">修行权柄</button><div class="legend"><span class="dot"></span>青色：当前可调用<br><span class="dot gold"></span>金色：唯一传承或高危冷却</div></aside>
      <main><div class="toolbar"><div class="result" id="result">显示 12 件至宝</div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索名称、权柄、效果" aria-label="搜索至宝"></label></div><section class="grid" id="grid" aria-live="polite"></section></main>
    </div>
  </div>
  <div class="drawer" id="drawer" aria-hidden="true"><div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="drawer-head"><div><h2 id="drawer-title"></h2><div class="epithet" id="drawer-epithet"></div></div><button class="close" id="close" aria-label="关闭详情">×</button></div><img class="drawer-art" id="drawer-art" alt=""><div class="meta" id="drawer-meta"></div><h3>权柄效果</h3><ul id="drawer-effects"></ul><h3>可用指令</h3><div id="drawer-commands"></div><h3>执掌备注</h3><p class="meta" id="drawer-lore"></p></div></div>
  <script src="./treasure-data.js"></script><script src="./treasure-assets.js"></script>
  <script>
    const data = window.TREASURE_DATA, grid = document.querySelector('#grid'), result = document.querySelector('#result');
    const state = {filter:'all', domain:'', query:''};
    const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function matches(item){const text=[item.name,item.epithet,item.domain,item.lore,...item.effects].join(' ').toLowerCase();return (state.filter==='all'||item.status===state.filter)&&(!state.domain||item.domain===state.domain)&&(!state.query||text.includes(state.query.toLowerCase()))}
    function render(){const items=data.filter(matches);result.textContent=`显示 ${items.length} 件至宝`;grid.innerHTML=items.length?items.map(item=>`<article class="card"><img class="art" src="${window.TREASURE_ART(item)}" alt="${esc(item.name)}图像"><div class="card-body"><div class="card-top"><div><h2>${esc(item.name)}</h2><div class="epithet">${esc(item.epithet)}</div></div><span class="badge ${item.status==='传承唯一'?'unique':''}">${esc(item.status)}</span></div><span class="domain">${esc(item.domain)} · ${esc(item.tier)}</span><p class="lore">${esc(item.lore)}</p><div class="effect-line">${esc(item.effects[0])}</div><button class="open" data-open="${item.id}">查看完整权柄 <span aria-hidden="true">→</span></button></div></article>`).join(''):'<div class="empty">没有符合条件的至宝档案</div>';grid.querySelectorAll('[data-open]').forEach(button=>button.addEventListener('click',()=>openDrawer(button.dataset.open)))}
    function openDrawer(id){const item=data.find(entry=>entry.id===id);if(!item)return;document.querySelector('#drawer-title').textContent=item.name;document.querySelector('#drawer-epithet').textContent=item.epithet;document.querySelector('#drawer-art').src=window.TREASURE_ART(item);document.querySelector('#drawer-art').alt=item.name+'图像';document.querySelector('#drawer-meta').textContent=`${item.status} · ${item.domain}权柄 · 冷却 ${item.cooldown} · 代价：${item.cost}`;document.querySelector('#drawer-effects').innerHTML=item.effects.map(effect=>`<li>${esc(effect)}</li>`).join('');document.querySelector('#drawer-commands').innerHTML=item.commands.map(command=>`<span class="command">${esc(command)}</span>`).join('');document.querySelector('#drawer-lore').textContent=item.lore;document.querySelector('#drawer').classList.add('is-open');document.querySelector('#drawer').setAttribute('aria-hidden','false')}
    function closeDrawer(){document.querySelector('#drawer').classList.remove('is-open');document.querySelector('#drawer').setAttribute('aria-hidden','true')}
    document.querySelector('#search').addEventListener('input',event=>{state.query=event.target.value.trim();render()});document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{state.filter=button.dataset.filter;state.domain='';document.querySelectorAll('.filter').forEach(item=>item.classList.remove('active'));button.classList.add('active');render()}));document.querySelectorAll('[data-domain]').forEach(button=>button.addEventListener('click',()=>{state.domain=state.domain===button.dataset.domain?'':button.dataset.domain;state.filter='all';document.querySelectorAll('.filter').forEach(item=>item.classList.remove('active'));button.classList.toggle('active',!!state.domain);render()}));document.querySelector('#close').addEventListener('click',closeDrawer);document.querySelector('#drawer').addEventListener('click',event=>{if(event.target.id==='drawer')closeDrawer()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDrawer()});render();
  </script>
</body>
</html>
