            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

            font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

            max-width: 1200px;
            margin: 0 auto;
            background: rgba(10, 10, 30, 0.9);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 50px rgba(77, 150, 255, 0.2);

        /* 头部样式 */
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;

                rgba(28, 40, 51, 0.9) 50%,
                rgba(15, 23, 42, 0.9) 100%);
            border-radius: 15px;
            border: 2px solid rgba(100, 149, 237, 0.3);
        }
        
        .title {
            font-size: 40px;
            font-weight: bold;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcf7f, #4d96ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(77, 150, 255, 0.4);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-size: 18px;
            color: #8a8aff;
            opacity: 0.9;
        }
        
        /* 玩家信息栏 */
        .player-info {
            display: flex;
            justify-content: space-around;
            background: rgba(20, 20, 40, 0.7);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid rgba(100, 100, 255, 0.2);
        }
        
        .info-item {
            text-align: center;
        }
        
        .info-label {
            font-size: 12px;
            color: #8a8aff;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 20px;
            font-weight: bold;
            color: #ffd93d;
        }
        
        /* 位面网格 */
        .realms-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        
        /* 位面卡片 */
        .realm-card {
            background: linear-gradient(145deg, rgba(20, 20, 40, 0.9), rgba(10, 10, 30, 0.9));
            border-radius: 15px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(100, 100, 255, 0.2);
            min-height: 400px;
        }
        
        /* 位面徽章 */
        .realm-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50%;
            z-index: 1;
        }
        
        /* 位面名称区域 */
        .card-header {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .realm-name {
            font-size: 22px;
            font-weight: bold;
            color: #ffd93d;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* 位面图标 */
        .realm-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
        }
        
        .realm-status {
            position: absolute;
            top: 20px;
            right: 90px;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
        }
        
        .status-current {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }
        
        .status-unlocked {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
        
        .status-locked {
            background: linear-gradient(135deg, #6b7280, #4b5563);
            color: #e5e7eb;
        }
        
        /* 位面描述 */
        .realm-desc {
            font-size: 13px;
            line-height: 1.5;
            color: #cbd5e0;
            margin-bottom: 15px;
            min-height: 60px;
        }
        
        /* 位面信息 */
        .realm-info {
            margin-bottom: 15px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

            color: #8a8aff;
            font-size: 12px;
        }
        
        .info-value-small {
            font-size: 13px;
            font-weight: bold;

            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }
        
        .req-title {
            color: #ff6b6b;

            margin-bottom: 8px;

        .req-label {

            font-size: 12px;

            font-size: 12px;

        .cost-title {

            text-align: center;

        /* 响应式设计 */

            .realms-container {

            }

            }

            }
            return num.toString();

                '致命': 'danger-extreme',
                '未知': 'danger-extreme',
                '不可知': 'danger-god',
                '仙王级': 'danger-god'
            };
            return map[danger] || 'danger-medium';
        }

        // 获取位面徽章文字
        function getBadgeText(level) {
            const map = {
                0: '凡',
                1: '仙',
                1.5: '下',
                2: '遮',
                2.5: '九',
                3: '界',
                4: '时',
                5: '永',
                6: '域'
            };
            return map[level] || '?';
        }

        // 创建位面卡片
        function createRealmCard(realm) {
            const meetsReq = checkRequirements(realm.requirements);
            const travelTime = calculateTravelTime(realm.costs.time);
            const realmClass = `realm-${realm.id.toString().replace('.', '_')}`;
            const badgeText = getBadgeText(realm.level);
            
            return `
                <div class="realm-card ${realmClass}">
                    ${realm.isSpecial ? `<div class="special-mark">特殊位面</div>` : ''}
                    
                    <div class="realm-badge">${badgeText}</div>
                    
                    <div class="card-header">
                        <div class="realm-name">
                            <div class="realm-icon">${realm.icon}</div>
                            ${realm.name}
                        </div>
                        <div class="realm-status ${realm.status}">
                            ${realm.status === 'current' ? '当前位置' : 
                              realm.status === 'unlocked' ? '可穿梭' : '未解锁'}
                        </div>
                    </div>
                    
                    <div class="realm-desc">${realm.description}</div>
                    
                    <div class="realm-info">
                        <div class="info-row">
                            <span class="info-label-small">位面层级</span>
                            <span class="info-value-small">${realm.level}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label-small">危险等级</span>
                            <span class="info-value-small ${getDangerClass(realm.danger)}">${realm.danger}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label-small">坐标值</span>
                            <span class="info-value-small">${realm.location}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label-small">位面特征</span>
                            <span class="info-value-small">${realm.features}</span>
                        </div>
                    </div>
                    
                    <div class="requirements">
                        <div class="req-title">传送条件</div>
                        <div class="req-item">
                            <span class="req-label">秘境等级</span>
                            <span class="req-value ${playerData.mijinLevel >= realm.requirements.mijin ? 'req-met' : 'req-not-met'}">
                                ${playerData.mijinLevel}/${realm.requirements.mijin}
                            </span>
                        </div>
                        <div class="req-item">
                            <span class="req-label">仙古等级</span>
                            <span class="req-value ${playerData.xianguLevel >= realm.requirements.xiangu ? 'req-met' : 'req-not-met'}">
                                ${playerData.xianguLevel}/${realm.requirements.xiangu}
                            </span>
                        </div>
                        <div class="req-item">
                            <span class="req-label">肉身境界</span>
                            <span class="req-value ${playerData.physiqueLevel >= realm.requirements.physique ? 'req-met' : 'req-not-met'}">
                                ${playerData.physiqueLevel >= 42 ? '地仙' : '凡体'}/${realm.requirements.physique}
                            </span>
                        </div>
                    </div>
                    
                    <div class="cost-section">
                        <div class="cost-title">穿梭消耗</div>
                        <div class="cost-grid">
                            <div class="cost-item">
                                <div class="cost-label">修为</div>
                                <div class="cost-value">${formatNumber(realm.costs.修为)}</div>
                            </div>
                            <div class="cost-item">
                                <div class="cost-label">血气</div>
                                <div class="cost-value">${formatNumber(realm.costs.血气)}</div>
                            </div>
                            <div class="cost-item">
                                <div class="cost-label">寿元</div>
                                <div class="cost-value">${formatNumber(realm.costs.寿元)}</div>
                            </div>
                        </div>
                        <div style="text-align: center; margin-top: 8px; color: #8a8aff; font-size: 11px;">
                            时间: ${travelTime}分钟 ${playerData.learnedSkills.includes('鲲鹏宝术') ? '(鲲鹏加速)' : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        // 渲染位面
        function renderRealms() {
            const container = document.getElementById('realms-container');
            container.innerHTML = realmsData.map(createRealmCard).join('');
            
            // 更新统计数据
            const unlockedCount = realmsData.filter(r => r.status === 'unlocked' || r.status === 'current').length;
            document.getElementById('unlocked-count').textContent = `${unlockedCount}/${realmsData.length}`;
            document.getElementById('mijing-level').textContent = playerData.mijinLevel;
            document.getElementById('xiangu-level').textContent = playerData.xianguLevel;
            document.getElementById('physique-level').textContent = playerData.physiqueLevel >= 42 ? '地仙' : '凡体';
        }

        // 设置生成时间
        function setGenerateTime() {
            const now = new Date();
            const timeStr = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            }).replace(/\//g, '年').replace(/\//g, '月').replace(' ', '日 ');
            
            document.getElementById('gen-time').textContent = timeStr;
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            setGenerateTime();
            renderRealms();
        });
    </script>
</body>
</html>
