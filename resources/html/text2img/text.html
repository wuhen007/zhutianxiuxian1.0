<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>文字消息</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      background: #ffffff;
    }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB",
        "Source Han Sans SC", "Noto Sans CJK SC", "WenQuanYi Micro Hei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* 截图按 #container 的盒子裁切，所以用 inline-block 让宽高贴合内容 */
    #container {
      position: relative;
      display: inline-block;
      width: 720px;
      padding: 40px 42px 38px;
      background:
        radial-gradient(120% 90% at 100% 100%, rgba(77, 107, 254, 0.1) 0%, rgba(77, 107, 254, 0) 62%),
        linear-gradient(158deg, #f8faff 0%, #f1f5ff 52%, #e8eeff 100%);
      border: 2px solid rgba(77, 107, 254, 0.45);
      border-radius: 20px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.9);
      overflow: hidden;
      color: #1b2130;
    }

    /* 顶部一条品牌色细线 */
    #container::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 5px;
      background: linear-gradient(90deg, #4d6bfe 0%, #7c93ff 60%, #a9b9ff 100%);
      z-index: 2;
    }

    /* DeepSeek 蓝鲸：右下角淡印，纯装饰，不参与排版 */
    #whale {
      position: absolute;
      right: -34px;
      bottom: -26px;
      width: 470px;
      height: 353px;
      background-image: url("{{whaleUrl}}");
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0.15;
      z-index: 0;
      pointer-events: none;
    }


    #text {
      position: relative;
      z-index: 1;
      font-size: 27px;
      line-height: 1.85;
      letter-spacing: 0.4px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      font-weight: 400;
    }

    .page {
      position: relative;
      z-index: 1;
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px dashed rgba(77, 107, 254, 0.32);
      color: #6b7dc4;
      font-size: 20px;
      letter-spacing: 1px;
      text-align: right;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="whale"></div>
    <div id="text">{{text}}</div>
    {{if total > 1}}<div class="page">{{page}} / {{total}}</div>{{/if}}
  </div>
</body>
</html>
