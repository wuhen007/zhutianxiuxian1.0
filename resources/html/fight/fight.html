<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{fightmsg}}</title>
    <style>
        /* ==== 颜色变量定义 ==== */
        :root {
            --gold: #ffd700;
            --red: #ff3860;
            --green: #00ff00;
            --blue: #4a90e2;
            --purple: #b967ff;
            --orange: #ff9500;
            --cyan: #00b4d8;
            --dark-purple: #9b59b6;
            --dark-red: #e74c3c;
            --dark-gold: #b8860b;
            --gray: #8f8fb7;
            --light-gray: #b0b0b0;
            --dark-gray: #4a4a8a;
            
            --gold-rgb: 255, 215, 0;
            --red-rgb: 255, 56, 96;
            --green-rgb: 0, 255, 0;
            --blue-rgb: 74, 144, 226;
            --purple-rgb: 185, 103, 255;
            --orange-rgb: 255, 149, 0;
            --cyan-rgb: 0, 180, 216;
            --dark-purple-rgb: 155, 89, 182;
            --dark-red-rgb: 231, 76, 60;
            --dark-gold-rgb: 184, 134, 11;
            
            --bg-dark: rgba(10, 10, 26, 0.9);
            --bg-header: linear-gradient(to right, rgba(44, 14, 55, 0.95) 0%, rgba(26, 26, 46, 0.95) 100%);
            --bg-body: rgba(8, 8, 20, 0.7);
            --bg-message: rgba(30, 30, 50, 0.5);
            --bg-message-hover: rgba(40, 40, 60, 0.6);
            --bg-chapter: rgba(20, 20, 40, 0.8);
            
            --border-container: rgba(42, 42, 74, 0.8);
            --border-header: rgba(255, 215, 0, 0.5);
            --border-message: rgba(74, 74, 138, 0.4);
            --border-chapter: rgba(255, 215, 0, 0.4);
            
            --time-river-gradient: linear-gradient(to right, 
                #ff0000, #ff8000, #ffff00, 
                #80ff00, #00ff80, #00ffff, 
                #0080ff, #0000ff, #8000ff);
        }

        * {
            margin: 0; 
            padding: 0;
            box-sizing: border-box;
            font-family: "AlimamaDongFangDaKai-Regular", "Microsoft YaHei", "SimHei", sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, rgba(12, 12, 37, 0.9) 0%, rgba(8, 8, 21, 0.9) 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            text-align: center;
            background-image: url('{{pluResPath}}/img/najie/2.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-blend-mode: overlay;
        }
        
        .fight-container {
            width: 100%;
            max-width: 800px;
            background: var(--bg-dark);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7),
                        0 0 0 1px var(--border-header),
                        0 0 30px rgba(255, 215, 0, 0.15) inset;
            border: 1px solid var(--border-container);
            backdrop-filter: blur(10px);
        }
        
        .fight-header {
            background: var(--bg-header);
            padding: 35px;
            text-align: center;
            border-bottom: 2px solid var(--border-header);
            position: relative;
        }
        
        .fight-header::after {
            content: "❖";
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--gold);
            font-size: 24px;
            text-shadow: 0 0 15px rgba(var(--gold-rgb), 0.6);
        }
        
        .fight-title {
            font-size: 48px;
            font-weight: bold;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(var(--gold-rgb), 0.4),
                         0 0 40px rgba(var(--gold-rgb), 0.2);
            letter-spacing: 6px;
            margin-bottom: 12px;
        }
        
        .fight-subtitle {
            font-size: 20px;
            color: var(--light-gray);
            letter-spacing: 3px;
        }
        
        .fight-body {
            padding: 0;
            background: var(--bg-body);
        }
        
        /* ==== 章节样式 - 默认全部展开 ==== */
        .chapter {
            margin: 0;
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
        }
        
        .chapter:last-child {
            border-bottom: none;
        }
        
        .chapter-header {
            background: linear-gradient(to right, 
                rgba(255, 215, 0, 0.15) 0%, 
                rgba(255, 215, 0, 0.08) 50%,
                rgba(255, 215, 0, 0.15) 100%);
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid var(--gold);
            position: relative;
        }
        
        .chapter-title {
            font-size: 22px;
            color: var(--gold);
            font-weight: bold;
            text-shadow: 0 0 8px rgba(var(--gold-rgb), 0.4);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .chapter-icon {
            font-size: 28px;
            filter: drop-shadow(0 0 5px rgba(var(--gold-rgb), 0.5));
        }
        
        .chapter-count {
            color: var(--gray);
            font-size: 14px;
            font-weight: normal;
        }
        
        .chapter-toggle {
            color: var(--gold);
            font-size: 18px;
            opacity: 0.6;
            transition: transform 0.3s ease;
        }
        
        /* 默认展开状态 - 不需要旋转 */
        .chapter .chapter-toggle {
            transform: rotate(0deg);
        }
        
        /* 折叠状态 - 旋转箭头 */
        .chapter.collapsed .chapter-toggle {
            transform: rotate(-90deg);
        }
        
        .chapter-content {
            max-height: 5000px; /* 足够大的高度确保展开 */
            overflow: hidden;
            transition: max-height 0.5s ease, padding 0.3s ease;
            padding: 20px 25px;
        }
        
        /* 折叠时的高度 */
        .chapter.collapsed .chapter-content {
            max-height: 0;
            padding: 0 25px;
        }
        
        /* ==== 消息样式 ==== */
        .fight-message {
            padding: 16px 20px;
            margin-bottom: 14px;
            border-radius: 10px;
            font-size: 22px;
            background: var(--bg-message);
            border-left: 4px solid var(--border-message);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-align: left;
            line-height: 1.7;
        }

        .fight-message:last-child {
            margin-bottom: 0;
        }
        
        .fight-message:hover {
            background: var(--bg-message-hover);
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }
        
        /* ==== 消息类型样式 ==== */
        .critical-hit {
            border-left-color: rgba(var(--red-rgb), 0.8);
            background: linear-gradient(to right, rgba(var(--red-rgb), 0.12), var(--bg-message));
        }
        
        .heal-message {
            border-left-color: rgba(var(--green-rgb), 0.8);
            background: linear-gradient(to right, rgba(var(--green-rgb), 0.12), var(--bg-message));
        }
        
        .damage-message {
            border-left-color: rgba(var(--orange-rgb), 0.8);
            background: linear-gradient(to right, rgba(var(--orange-rgb), 0.12), var(--bg-message));
        }
        
        .deprive-message {
            border-left-color: rgba(var(--purple-rgb), 0.8);
            background: linear-gradient(to right, rgba(var(--purple-rgb), 0.18), var(--bg-message));
        }
        
        .daoshen-message {
            border-left-color: rgba(var(--dark-gold-rgb), 0.8);
            background: linear-gradient(to right, rgba(var(--dark-gold-rgb), 0.18), var(--bg-message));
        }
        
        .huazizai-message {
            border-left-color: rgba(var(--cyan-rgb), 0.8);
            background: linear-gradient(to right, rgba(var(--cyan-rgb), 0.18), var(--bg-message));
        }
        
        .disaster-message {
            border-left-color: rgba(50, 50, 50, 0.9);
            background: linear-gradient(to right, rgba(30, 30, 30, 0.6), var(--bg-message));
            color: #e0e0e0;
        }
        
        .buff-message {
            border-left-color: rgba(var(--green-rgb), 0.8);
            background: linear-gradient(to right, rgba(var(--green-rgb), 0.12), var(--bg-message));
        }
        
        .debuff-message {
            border-left-color: rgba(var(--red-rgb), 0.8);
            background: linear-gradient(to right, rgba(var(--red-rgb), 0.12), var(--bg-message));
        }
        
        .resurrection-message {
            border-left-color: rgba(var(--gold-rgb), 0.8);
            background: linear-gradient(to right, rgba(var(--gold-rgb), 0.15), var(--bg-message));
        }
        
        .system-message {
            border-left-color: rgba(var(--blue-rgb), 0.8);
            background: linear-gradient(to right, rgba(var(--blue-rgb), 0.12), var(--bg-message));
        }
        
        .status-message {
            border-left-color: rgba(var(--purple-rgb), 0.8);
            background: linear-gradient(to right, rgba(var(--purple-rgb), 0.12), var(--bg-message));
        }
        
        .action-bar-message {
            border-left-color: rgba(var(--cyan-rgb), 0.8);
            background: linear-gradient(to right, rgba(var(--cyan-rgb), 0.12), var(--bg-message));
            font-style: italic;
            color: var(--cyan);
        }
        
        /* ==== 关键词样式 ==== */
        .highlight {
            color: var(--gold);
            font-weight: bold;
            text-shadow: 0 0 8px rgba(var(--gold-rgb), 0.4);
        }
        
        .damage-value {
            color: var(--red);
            font-weight: bold;
            text-shadow: 0 0 5px rgba(var(--red-rgb), 0.3);
        }
        
        .heal-value {
            color: var(--green);
            font-weight: bold;
            text-shadow: 0 0 8px rgba(var(--green-rgb), 0.4);
        }
        
        .time-river {
            background: var(--time-river-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: bold;
        }
        
        .daoshen-color {
            color: var(--dark-gold);
            font-weight: bold;
            text-shadow: 0 0 8px rgba(var(--dark-gold-rgb), 0.6);
        }
        
        .skill-name {
            color: var(--gold);
            font-weight: bold;
            text-shadow: 0 0 8px rgba(var(--gold-rgb), 0.4);
        }
        
        .attack-keyword {
            color: var(--red);
            font-weight: bold;
            text-shadow: 0 0 5px rgba(var(--red-rgb), 0.3);
        }
        
        .defense-keyword {
            color: var(--blue);
            font-weight: bold;
            text-shadow: 0 0 5px rgba(var(--blue-rgb), 0.3);
        }
        
        .control-keyword {
            color: var(--purple);
            font-weight: bold;
            text-shadow: 0 0 5px rgba(var(--purple-rgb), 0.3);
        }
        
        .element-keyword {
            color: var(--orange);
            font-weight: bold;
            text-shadow: 0 0 5px rgba(var(--orange-rgb), 0.3);
        }
        
        .cosmic-keyword {
            color: var(--cyan);
            font-weight: bold;
            text-shadow: 0 0 5px rgba(var(--cyan-rgb), 0.3);
        }
        
        .reincarnation-keyword {
            color: var(--dark-purple);
            font-weight: bold;
            text-shadow: 0 0 5px rgba(var(--dark-purple-rgb), 0.3);
        }
        
        .imperial-keyword {
            color: var(--dark-red);
            font-weight: bold;
            text-shadow: 0 0 5px rgba(var(--dark-red-rgb), 0.3);
        }
        
        /* ==== 回合标记样式 ==== */
        .round-marker {
            text-align: center;
            padding: 12px;
            margin: 18px 0;
            background: rgba(60, 60, 100, 0.25);
            border-radius: 20px;
            font-weight: bold;
            font-size: 20px;
            color: var(--gray);
            border: 1px dashed rgba(74, 74, 138, 0.6);
            position: relative;
            letter-spacing: 2px;
        }
        
        /* ==== 页脚样式 ==== */
        .fight-footer {
            padding: 20px;
            text-align: center;
            background: rgba(15, 15, 35, 0.9);
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            color: var(--gray);
            font-size: 16px;
            letter-spacing: 3px;
        }
        
        /* ==== 分隔线 ==== */
        .divider {
            height: 1px;
            background: linear-gradient(to right, 
                transparent, 
                rgba(255, 215, 0, 0.4), 
                transparent);
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="fight-container">
        <div class="fight-header">
            <div class="fight-title">诸天万界</div>
            <div class="fight-subtitle">大道争锋，胜者为王</div>
        </div>
        
        <div class="fight-body" id="fight">
            <!-- 战斗消息将在这里动态生成 -->
        </div>
        
        <div class="fight-footer">
            诸天万界修仙系统 · 大道印记
        </div>
    </div>

    <script>
        // 从页面标题获取所有消息
        function getAllMessages() {
            const title = document.title;
            if (title) {
                return title.split(',').map(msg => {
                    return msg
                        .replace(/[\[\]]/g, "")
                        .replace(/[ \t]+/g, ' ')
                        .replace(/\\n/g, '<br>')
                        .trim();
                });
            }
            return [];
        }
        
        // 检测消息类型
        function detectMessageType(message) {
            if (message.includes("暴击")) return "critical-hit";
            if (message.includes("治疗") || message.includes("恢复") || message.includes("回复")) return "heal-message";
            if (message.includes("伤害") || message.includes("损失") || message.includes("扣除")) return "damage-message";
            if (message.includes("剥夺")) return "deprive-message";
            if (message.includes("道身")) return "daoshen-message";
            if (message.includes("他化自在")) return "huazizai-message";
            if (message.includes("三灾六劫天人五衰")) return "disaster-message";
            if (message.includes("增益") || message.includes("提升") || message.includes("增加")) return "buff-message";
            if (message.includes("减益") || message.includes("降低") || message.includes("减少")) return "debuff-message";
            if (message.includes("复活") || message.includes("重生")) return "resurrection-message";
            if (message.includes("系统") || message.includes("法则") || message.includes("天道")) return "system-message";
            if (message.includes("状态") || message.includes("效果")) return "status-message";
            if (message.includes("元气") || message.includes("行动条") || message.includes("先机")) return "action-bar-message";
            return "";
        }
        
        // 高亮处理
        function highlightMessage(message) {
            let text = message;
            
            // 数字高亮
            text = text.replace(/(\d+(,\d+)*)/g, '<span class="damage-value">$1</span>');
            
            // 恢复类高亮
            text = text.replace(/(恢复|治疗|回复|愈合|复活|重生|苏生|回春|疗伤|治愈)(了)?\s*<span class="damage-value">(\d+(,\d+)*)<\/span>/g, 
                '$1$2 <span class="heal-value">$3</span>');
            
            // 技能名高亮
            const skills = /(鬼剑|影杀|八荒剑法|斩八荒|六道轮回拳|霸拳|天动万象|太素|心禅不灭诀|万剑归宗|无始无终|太阳真火|混沌青莲|虚空永恒|斗战圣法|葬仙图|太皇经|无量仙功|皇极斩|梦之㱬|梦轮|轮回诸天拳|命运神道体|极道天魔|仙神灭绝功|邪神梵天印|第一魔功|噬天|托天魔功|天生至尊|上苍劫光|涅槃至尊|轮回宝术|终极涅槃至尊|第三至尊术|重瞳|毁灭本源|轮回道体|灭道杀神体|杀破神|鸿蒙道体|鸿蒙法则|九重魔功|九重猪王|猪王拳|经天纬地|维宙星灭诀|不灭天功|一念花开|君临天下|大成荒古圣体|天帝拳|木之本樱|斗字秘|虚空经|妖帝古经|恒宇经|太阳真经|太阴真经|无始经|草字剑诀|平乱诀|六道轮回天功|真龙宝术|鲲鹏宝术|雷帝宝术|柳神法|原始真解|混沌体|先天圣体道胎|飞仙诀|吞天魔功|永恒终极剑道|苍天霸体|鹿目圆|圆环之理|圆神|斩天道|星耀天地|十方皆杀|鹏羽剑诀|天鹏搏龙术|乱古帝经|大帝之姿|武道天眼|小成苍天霸体|霸血焚天诀|龙拳|十世轮回经|真龙困天术|黑龙断苍宇|世界树法则|仙王九封|天子印|无双战诀|弑仙术|鹤舞九天|仙劫剑诀|破界杀术|掌中世界|阴阳逆乱诀|苍穹霸印|混沌莲步|太阴一转十万年|紫气东来术|霸体祖经|兵字秘|黄金战车诀|乱古战斧法|大帝印|永恒的放逐|万灵化道|乱古圣诀|金鹏撕天爪|大荒戟法|鹏王啸)/g;
            text = text.replace(skills, '<span class="skill-name">$1</span>');
            
            // 关键词高亮
            text = text.replace(/(拳|剑|刀|戟|斧|印|诀|经|法|术|功|宝术|九秘|图|轮|阵|领域|界|天帝|天地|宇宙|星辰|虚空|时空|混沌|阴阳|轮回|因果|大道|法则|劫|灾|衰)/g, 
                '<span class="cosmic-keyword">$1</span>');
            
            text = text.replace(/(攻击|防御|生命|血量|属性|伤害|重创|击伤|破碎|崩灭|撕裂|斩|劈|轰|砸|刺|穿|灭|破|碎|崩|裂|震|爆|焚|灼|冻|冰|火|风|雷|电|光|暗)/g, 
                '<span class="attack-keyword">$1</span>');
            
            text = text.replace(/(禁锢|冻结|震慑|压制|定身|封锁|镇压|困|缚|绑|锁|封|镇|慑|控|制|支配|操纵)/g, 
                '<span class="control-keyword">$1</span>');
            
            text = text.replace(/(恢复|治疗|回复|愈合|复活|再生|苏生|回春|疗伤|治愈|滋补|养)/g, 
                '<span class="heal-value">$1</span>');
            
            text = text.replace(/(帝|皇|王|圣|神|仙|魔|妖|鬼|佛|尊|主|君|霸|开天辟地|尊|祖|宗|师|圣体|道胎|灵根|血脉)/g, 
                '<span class="imperial-keyword">$1</span>');
            
            text = text.replace(/(火|水|风|雷|土|木|金|光|暗|阴|阳|元素|五行|八卦|太极|两仪|四象)/g, 
                '<span class="element-keyword">$1</span>');
            
            // 特殊关键词
            text = text.replace(/(时间长河|六道轮回)/g, '<span class="time-river">$1</span>');
            text = text.replace(/(道身)/g, '<span class="daoshen-color">$1</span>');
            
            return text;
        }
        
        // 渲染章节
        function renderChapters() {
            const messages = getAllMessages();
            const container = document.getElementById('fight');
            container.innerHTML = '';
            
            if (!messages || messages.length === 0) {
                container.innerHTML = '<div class="fight-message">暂无数据</div>';
                return;
            }
            
            // 定义章节规则
            const chapterRules = [
                {
                    name: "战前准备",
                    icon: "⚔",
                    test: (msg) => msg.includes("天地元气") || msg.includes("天道法则") || msg.includes("遁光速度") || msg.includes("大战一触即发")
                },
                {
                    name: "抢占先机",
                    icon: "☯",
                    test: (msg) => msg.includes("元气充盈") || msg.includes("抢占先机") || msg.includes("行动条")
                },
                {
                    name: "神通对决",
                    icon: "🔥",
                    test: (msg) => msg.includes("施展") || msg.includes("催动") || msg.includes("演化") || msg.includes("发动") || msg.includes("触发")
                },

                {
                    name: "战斗结算",
                    icon: "🏆",
                    test: (msg) => msg.includes("击败") || msg.includes("胜负") || msg.includes("统计") || msg.includes("行动次数")
                }
            ];
            
            // 将消息分类到章节
            const chapters = [];
            let currentChapter = null;
            let roundCount = 0;
            
            messages.forEach((message, index) => {
                // 检测回合
                if (message.includes("回合")) {
                    const roundMatch = message.match(/第(\d+)回合/);
                    if (roundMatch) {
                        roundCount = parseInt(roundMatch[1]);
                    }
                }
                
                // 检测章节类型
                let matchedRule = null;
                for (const rule of chapterRules) {
                    if (rule.test(message)) {
                        matchedRule = rule;
                        break;
                    }
                }
                
                // 创建新章节或添加到当前章节
                if (matchedRule && (!currentChapter || currentChapter.name !== matchedRule.name)) {
                    currentChapter = {
                        name: matchedRule.name,
                        icon: matchedRule.icon,
                        messages: [],
                        round: roundCount
                    };
                    chapters.push(currentChapter);
                }
                
                if (currentChapter) {
                    currentChapter.messages.push({
                        text: message,
                        round: roundCount,
                        index: index
                    });
                } else {
                    // 默认章节
                    if (chapters.length === 0) {
                        chapters.push({
                            name: "战斗开始",
                            icon: "🌟",
                            messages: [],
                            round: 0
                        });
                    }
                    chapters[0].messages.push({
                        text: message,
                        round: roundCount,
                        index: index
                    });
                }
            });
            
            // 渲染章节 - 默认全部展开
            chapters.forEach((chapter, chapterIndex) => {
                const chapterDiv = document.createElement('div');
                chapterDiv.className = 'chapter'; // 默认不添加 collapsed 类
                
                // 章节头部
                const header = document.createElement('div');
                header.className = 'chapter-header';
                header.innerHTML = `
                    <div class="chapter-title">
                        <span class="chapter-icon">${chapter.icon}</span>
                        <span>${chapter.name}</span>
                        <span class="chapter-count">(${chapter.messages.length}条)</span>
                    </div>
                    <div class="chapter-toggle">▼</div>
                `;
                
                // 点击折叠/展开（可选功能）
                header.addEventListener('click', () => {
                    chapterDiv.classList.toggle('collapsed');
                });
                
                // 章节内容
                const content = document.createElement('div');
                content.className = 'chapter-content';
                
                chapter.messages.forEach(msg => {
                    const msgType = detectMessageType(msg.text);
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `fight-message ${msgType}`;
                    msgDiv.innerHTML = highlightMessage(msg.text);
                    content.appendChild(msgDiv);
                });
                
                chapterDiv.appendChild(header);
                chapterDiv.appendChild(content);
                container.appendChild(chapterDiv);
            });
        }
        
        // 页面加载完成后渲染
        document.addEventListener('DOMContentLoaded', renderChapters);
    </script>
</body>
</html>
