<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{auctionmsg}}</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@700&display=swap');

:root {
    --gold: #f5d08a;
    --gold-dark: #b8860b;
    --ink: #2c1810;
}

body {
    margin: 0;
    padding: 30px;
    min-height: 100vh;
    background:
        url('https://img.freepik.com/free-vector/ancient-parchment-texture_1192149-1076.jpg')
        center/cover no-repeat fixed,
        radial-gradient(circle at 50% 30%, rgba(0,0,0,0.35), rgba(0,0,0,0.85));
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'ZCOOL KuaiLe', 'Ma Shan Zheng', 'Noto Serif SC', serif;
}

.auction-scroll {
    width: 100%;
    max-width: 860px;
    background: linear-gradient(to bottom,
        rgba(244,236,216,0.95),
        rgba(230,220,195,0.95)
    );
    border-radius: 10px;
    padding: 50px 60px;
    position: relative;
    box-shadow:
        0 25px 80px rgba(0,0,0,0.8),
        inset 0 0 150px rgba(184,134,11,0.2);
    border: 4px solid var(--gold-dark);
}

.auction-scroll::before,
.auction-scroll::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    height: 28px;
    background: linear-gradient(to right,
        #8b6914, #d4af37, #8b6914
    );
}

.auction-scroll::before { top: 0; border-radius: 10px 10px 0 0; }
.auction-scroll::after { bottom: 0; border-radius: 0 0 10px 10px; }

.auction-title {
    text-align: center;
    font-size: 56px;
    color: var(--ink);
    text-shadow:
        3px 3px 0 var(--gold),
        6px 6px 15px rgba(0,0,0,0.4);
    letter-spacing: 18px;
    margin-bottom: 12px;
}

.auction-subtitle {
    text-align: center;
    font-size: 22px;
    color: #444;
    letter-spacing: 10px;
    margin-bottom: 35px;
}

.auction-item {
    background: rgba(255,255,255,0.35);
    border-left: 8px solid var(--gold-dark);
    border-radius: 6px;
    padding: 20px 28px;
    margin-bottom: 24px;
    font-size: 26px;
    line-height: 2;
    color: var(--ink);
}

.auction-footer {
    text-align: center;
    font-size: 18px;
    color: #555;
    margin-top: 30px;
    letter-spacing: 6px;
    padding-top: 20px;
    border-top: 1px dashed #aaa;
}
</style>
</head>

<body>

<div class="auction-scroll" id="scroll">
    <div class="auction-title">☁ 星阁拍卖会 ☁</div>
    <div class="auction-subtitle">诸天奇珍 · 价高者得</div>

    <div id="content"></div>

    <div class="auction-footer">
        ❖ 请发送 #星阁出价 / 星阁内场出价 金额 参与竞拍 ❖
    </div>
</div>

<script>
function render(messages) {
  const container = document.getElementById('content');
  container.innerHTML = '';

  messages.forEach(msg => {
    const div = document.createElement('div');
    div.className = 'auction-item';
    div.innerHTML = msg;
    container.appendChild(div);
  });
}

try {
  const raw = document.title;
  const messages = raw.split(',').map(m => m.trim());
  render(messages);
} catch (e) {
  document.getElementById('content').innerHTML =
    '<div style="color:red;text-align:center;">拍卖数据解析失败</div>';
}
</script>

</body>
</html>
