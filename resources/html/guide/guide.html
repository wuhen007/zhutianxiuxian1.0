<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>踏入仙途 · 引导</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      background: #0b1020;
    }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB",
        "Source Han Sans SC", "Noto Sans CJK SC", "WenQuanYi Micro Hei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      /* 与 #container 同宽：截图按容器裁切不受影响，预览时也不会留黑边 */
      width: 760px;
      overflow: hidden;
    }

    /* 截图按 #container 裁切，用 inline-block 让宽高贴合内容 */
    #container {
      position: relative;
      display: inline-block;
      width: 760px;
      padding: 0 0 34px;
      background:
        radial-gradient(90% 60% at 100% 0%, rgba(124, 92, 255, 0.28) 0%, rgba(124, 92, 255, 0) 60%),
        radial-gradient(70% 50% at 0% 100%, rgba(56, 189, 248, 0.18) 0%, rgba(56, 189, 248, 0) 60%),
        linear-gradient(160deg, #111a33 0%, #0d1428 55%, #0a1020 100%);
      border-radius: 22px;
      overflow: hidden;
      color: #e8ecf8;
    }

    /* 顶部品牌线 */
    #container::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 5px;
      background: linear-gradient(90deg, #7c5cff 0%, #38bdf8 55%, #f5c86b 100%);
    }

    /* ───────── 头部 ───────── */
    .head {
      padding: 38px 44px 26px;
    }

    .kicker {
      display: inline-block;
      padding: 5px 13px;
      border-radius: 999px;
      font-size: 15px;
      letter-spacing: 2px;
      color: #c9b6ff;
      background: rgba(124, 92, 255, 0.16);
      border: 1px solid rgba(124, 92, 255, 0.45);
    }

    h1 {
      margin-top: 16px;
      font-size: 40px;
      line-height: 1.25;
      letter-spacing: 2px;
      font-weight: 700;
      background: linear-gradient(92deg, #ffffff 0%, #c9d6ff 55%, #f5c86b 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .sub {
      margin-top: 10px;
      font-size: 19px;
      line-height: 1.6;
      color: #93a2c4;
      letter-spacing: 0.3px;
    }

    /* ───────── 步骤 ───────── */
    .steps {
      padding: 4px 44px 0;
    }

    .step {
      position: relative;
      display: flex;
      gap: 20px;
      padding: 22px 24px;
      margin-bottom: 16px;
      border-radius: 16px;
      background: linear-gradient(150deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.035) 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* 左侧编号徽章 */
    .badge {
      flex: 0 0 auto;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: #0b1020;
      background: linear-gradient(145deg, #8f74ff 0%, #6d4dfa 100%);
      box-shadow: 0 6px 18px rgba(109, 77, 250, 0.35);
    }

    /* 两步都是群主操作，用紫色徽章统一 */
    .step.three .badge {
      background: linear-gradient(145deg, #f7d488 0%, #e0a93d 100%);
      box-shadow: 0 6px 18px rgba(224, 169, 61, 0.32);
    }

    .step-body {
      flex: 1 1 auto;
      min-width: 0;
    }

    .step-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .step-title {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    .tag {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 14px;
      letter-spacing: 0.5px;
      color: #ffcf8a;
      background: rgba(245, 200, 107, 0.14);
      border: 1px solid rgba(245, 200, 107, 0.42);
    }

    /* 「免费」用青绿色，和「需群主操作」的橙黄区分开 */
    .tag.free {
      color: #7ef0c0;
      background: rgba(52, 211, 153, 0.14);
      border-color: rgba(52, 211, 153, 0.45);
    }

    .step-desc {
      margin-top: 9px;
      font-size: 19px;
      line-height: 1.72;
      color: #a9b6d4;
    }

    /* 路径 / 联系方式高亮 */
    .path {
      color: #8ee6ff;
      font-weight: 500;
    }

    .contact {
      display: inline-block;
      margin-top: 4px;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #ffe9b0;
      background: rgba(245, 200, 107, 0.12);
      border: 1px dashed rgba(245, 200, 107, 0.55);
      font-family: "Consolas", "Menlo", monospace;
    }

    /* ───────── 底部 ───────── */
    .foot {
      margin: 10px 44px 0;
      padding: 18px 22px;
      border-radius: 14px;
      background: linear-gradient(96deg, rgba(56, 189, 248, 0.14) 0%, rgba(124, 92, 255, 0.14) 100%);
      border: 1px solid rgba(124, 92, 255, 0.3);
      font-size: 19px;
      line-height: 1.7;
      color: #d7e0f5;
    }

    .foot b {
      color: #ffffff;
      font-size: 20px;
    }

    .cmd {
      display: inline-block;
      padding: 2px 10px;
      margin: 0 3px;
      border-radius: 8px;
      font-family: "Consolas", "Menlo", monospace;
      font-size: 19px;
      color: #0b1020;
      background: linear-gradient(145deg, #8ee6ff 0%, #38bdf8 100%);
      font-weight: 700;
    }

    .note {
      margin-top: 8px;
      font-size: 15px;
      letter-spacing: 1px;
      color: #7f8aa8;
    }
  </style>
</head>
<body>
  <div id="container">
    <div class="head">
      <span class="kicker">START HERE</span>
      <h1>踏入仙途 · 两步准备</h1>
      <p class="sub">完成下面两步，即可开始修仙之路</p>
    </div>

    <div class="steps">
      <div class="step one">
        <div class="badge">1</div>
        <div class="step-body">
          <div class="step-head">
            <span class="step-title">开启获取全部消息</span>
            <span class="tag">需群主操作</span>
          </div>
          <p class="step-desc">
            本游戏需要机器人能读取群里的全部消息，否则无法响应指令。<br />
            群主依次点击：<br />
            机器人头像 → 右上角「设置」→ 开启「获取全部消息」
          </p>
        </div>
      </div>

      <div class="step two">
        <div class="badge">2</div>
        <div class="step-body">
          <div class="step-head">
            <span class="step-title">打开机器人主动发言</span>
            <span class="tag">需群主操作</span>
          </div>
          <p class="step-desc">
            在同一设置页面里找到「机器人在群聊内主动发言」并打开，<br />
            否则机器人无法主动推送游戏消息。
          </p>
        </div>
      </div>
    </div>

    <div class="foot">
      <b>两步都完成后</b>，发送 <span class="cmd">#踏入仙途</span> 创建角色，正式开始游戏。
      <div class="note">本服务仅供娱乐</div>
    </div>
  </div>
</body>
</html>
