      desc: '势力商店查看与兑换'
    - icon: help-icon_2
      title: '#瑶池|摇光|剑云海(兑换xxx)'
      desc: '势力商店兑换'            
    - icon: help-icon_2
      title: '#领取瑶池俸禄|领取摇光俸禄|开启剑云海秘库'
      desc: '每日领取势力俸禄'                  
    - icon: help-icon_2
      title: '#职位晋升'
      desc: '捐献源石提升职位获得奖励'       

- group: 神城源石坊
  list:
    - icon: help-icon_2
      title: '#源石坊帮助'
      desc: '查看石园、切石、石王和源术对决的完整玩法'
    - icon: help-icon_2
      title: '#源石坊'
      desc: '进入外园赌石，也可指定地字号或天字号'
    - icon: help-icon_2
      title: '#源石坊对决'
      desc: '五选三挑战神城NPC，可组成石相并选择平注、加注或豪赌'
    - icon: help-icon_2
      title: '#神城兑换源石 xxx 数量'
      desc: '用各种品质的源石兑换源石' 

- group: 天机秘辛
  list:
    - icon: help-icon_2
      title: '#打听天机'
      desc: '花五百万斤源石打听天机'
    - icon: help-icon_2
      title: '#打听天机 天骄名位置 [灵石/源石]'
      desc: '花费灵石或源石推演指定天骄的当前位置，可据此讨伐天骄'
    - icon: help-icon_2
      title: '#推演天机 位置 天骄名'
      desc: '大帝境修士以2000万修为和2000万血气推演天骄位置'
    - icon: help-icon_2
      title: '#推演天机 功法名'
      desc: '大帝境修士以2000万修为和2000万血气溯源谁修炼了指定功法'
    - icon: help-icon_2
      title: '#消耗天机历练符*数量'
      desc: '按四境道行获得修为与血气，每张符独立概率触发双倍奖励'
    - icon: help-icon_2
      title: '#消耗万里定位符'
      desc: '锁定一名天骄气息，连续三次讨伐无需线索与坐标'
    - icon: help-icon_2
      title: '#布置源石场 / #查看源石场'
      desc: '源地师或源天师在当前坐标借山川龙脉布阵，强化三场讨伐PVE'
    - icon: help-icon_2
      title: '#打听天机 红尘仙'
      desc: '向天机老人追问红尘仙法总纲，开启九世仙路'
    - icon: help-icon_2
      title: '#打听天机 渡劫'
      desc: '寻找安全的渡劫地点'
    - icon: help-icon_2
      title: '#推演红尘仙'
      desc: '查看当前一世的命题、生门与可选择的世愿'
    - icon: help-icon_2
      title: '#立下世愿 化凡/争渡/逆天'
      desc: '选择本世逆活方式，不同世愿会改变消耗与心魔强度'
    - icon: help-icon_2
      title: '#我的红尘仙路'
      desc: '查看九世道痕、当前世愿与逆活进度'
    - icon: help-icon_2
      title: '#探索狠人道场'
      desc: ' 探索狠人大帝的道场，需要打听到对应情报和各大体质的精血，具备唯一性'
    - icon: help-icon_2
      title: '#探索乱古遗址'
      desc: '探索乱古大帝的坐化之地，需要打听到对应情报，具备唯一性'
    - icon: help-icon_2
      title: '#探索妖帝坟冢'
      desc: '探索青帝留下的坟冢，需要打听到对应情报和妖体，具备唯一性'        

- group: 路尽级仙帝
  list:      
    - icon: help-icon_2
      title: '#赐予练气/炼体升xx级@qq'
      desc: ' 一念开天，万道俯首！仙帝言出法随，可点化凡尘登临仙台'
    - icon: help-icon_2
      title: '#造化万物 xxx'
      desc: '掌中宇宙生灭，弹指间星河衍化，诸天万界皆在指间流转'
    - icon: help-icon_2
      title: '#映照/#映照@xxx'
      desc: '纵使魂归永寂，身化劫灰，亦能从岁月长河中唤回真灵'
    - icon: help-icon_2
      title: '#镇压@xxx'
      desc: '一念断万古，弹指葬纪元，使对方魂归永寂！/慎用'  
    - icon: help-icon_2
      title: '#重塑灵根@xxx'
      desc: '逆改先天根骨，重铸混沌道胎，纵是凡体亦可蜕变为无上仙躯' 
    - icon: help-icon_2
      title: '@xxx#为其逆天改根'
      desc: '仙帝具备一念间为他人逆天改命重塑天资的伟力'                        
    - icon: help-icon_2
      title: '#天意一刀斩众生万灵'
      desc: '仙帝的一缕心绪波动，就能显化在无穷诸天外，让诸天寂灭！/慎用，会斩掉所有低阶修士的修行道基' 
    - icon: help-icon_2
      title: '#重塑古今未来'
      desc: '翻动万古长空画卷，改写古今未来，岁月长河亦要改道而行'       

- group: 无上帝兵
  list:
    - icon: help-icon_2
      title: '#以[仙金]炼制帝兵[名称]'
      desc: '以九大仙金材料炼制本命帝兵，名称必须包含形态（剑/鼎/枪/钟/塔/镜/印/刀/斧/戟/鞭/琴/扇）'
      example: '#以仙泪绿金炼制帝兵混沌剑'
      
    - icon: help-icon_2
      title: '#以[仙金]融合帝兵'
      desc: '融合其他仙金提升帝兵潜力上限（每种仙金只能融合一次）'
      example: '#以凰血赤金融合帝兵'
      
    - icon: help-icon_2
      title: '#雷劫洗礼帝兵'
      desc: '使帝兵进阶：雏形→通灵→铭刻道与理→斩道王兵→圣兵→准帝兵→极道帝兵→仙器→仙王器→准仙帝器→仙帝器→祭道器'
      
    - icon: help-icon_2
      title: '#为帝兵更名[新名称]'
      desc: '为帝兵更改名称（仍需包含形态）'
      example: '#为帝兵更名天帝剑'
      
    - icon: help-icon_2
      title: '#蕴养帝兵'
      desc: '消耗修为、血气和生命本源温养帝兵，提升属性（需帝兵达到铭刻道与理品阶）'
      
    - icon: help-icon_2
      title: '#刻写帝兵'
      desc: '将自身之道刻写入帝兵（需帝兵达到圣兵品阶，玩家达到圣人王境界）'
      
    - icon: help-icon_2
      title: '#创造自身之道 [类型] [名称]'
      desc: '开创专属大道（类型：攻伐/护体/涅槃），为刻写帝兵做准备'
      example: '#创造自身之道 攻伐 杀伐剑道'
      
    - icon: help-icon_2
      title: '九大仙金材料'
      desc: '仙泪绿金、凰血赤金、龙纹黑金、永恒蓝金、神痕紫金、道劫黄金、羽化青金、混沌石精、大罗银精'  

