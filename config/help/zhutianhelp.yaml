      title: '#确认支取时间线 1,3 / 全部 / #取消支取时间线'
      desc: '仙帝与祭道从十分钟有效的推演清单中选择若干时间线或全部支取；每条时间线分别计算并叠加因果债'
    - icon: help-icon_2
      title: '#消减因果债 [数量]'
      desc: '至少需要一套体系达到准仙帝；准仙帝1:1.5，仙帝1:3，祭道1:5，祭道之上不产生因果代价'
    - icon: help-icon_2
      title: '#古史打击 @玩家 类型*事实名'
      desc: '秘境、仙古或花粉路任一体系至少达到准仙帝后，可改写证道、创道、造化、功法、物品或至宝事实'
    - icon: help-icon_2
      title: '#重塑形神 @玩家'
      desc: '仙帝承受大量因果债，为形神俱灭者重塑肉身、修补神魂并解除存档与纳戒封锁'
    - icon: help-icon_2
      title: '#祭道'
      desc: '若要在路尽级仙帝道果上更进一步极尽升华，必先焚烧大道，祭掉自身一切！' 
    - icon: help-icon_2
      title: '#凝聚精血'
      desc: '圣体，神体，先天道胎，混沌体，妖体等等可以凝聚本命精血'       

