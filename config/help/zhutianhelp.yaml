- group: 诸天镜总览
  list:
    - icon: help-icon_44
      title: '#诸天帮助 / #诸天镜帮助'
      desc: '打开诸天万界完整指令玉册'
    - icon: help-icon_44
      title: '#天机阁兑换诸天镜 / #使用诸天镜'
      desc: '兑换最基础的一阶诸天镜并绑定；旧异世界灵根会自动迁入化身谱'
    - icon: help-icon_44
      title: '#诸天镜'
      desc: '查看镜阶、每日镜能、淬炼材料、世界印记、异界遗物和当前化身'
    - icon: help-icon_44
      title: '#淬炼诸天镜'
      desc: '材料满足后将诸天镜由一阶逐步淬炼至七阶，并解锁更高投影世界'
    - icon: help-icon_44
      title: '#诸天世界'
      desc: '查看八个可投影世界的难度、主境界与诸天镜阶位要求'
    - icon: help-icon_44
      title: '#投影诸天 [世界名]'
      desc: '消耗一点镜能进入指定世界；不填世界名时从当前可进入的世界中随机选择'
    - icon: help-icon_44
      title: '1/2/3/4 / #退出投影'
      desc: '投影或专属世界探索期间选择剧情分支；#退出投影仅用于中止神魂投影'

- group: 诸天化身
  list:
    - icon: help-icon_45
      title: '#诸天化身'
      desc: '查看已经收录的异世界化身、当前阶段与下一步进阶目标'
    - icon: help-icon_45
      title: '#装载化身 [化身名] / #装载化身 本源'
      desc: '切换到已收录化身，或恢复进入诸天镜前保存的本源灵根'
    - icon: help-icon_45
      title: '化身进阶境界'
      desc: '第二阶段需地仙本体与大能级额外体系；第三阶段需金仙与准帝级；第四阶段需究极仙王与准仙帝级'
    - icon: help-icon_45
      title: '#道化之身 / #万身归真'
      desc: '查看投影产生的道化之身，或在仙王境后将全部道化之身归真回收'

- group: 友枝町与木之本樱
  list:
    - icon: help-icon_46
      title: '#友枝町 / #探索友枝町 [地点]'
      desc: '消耗镜能探索，取得封印之钥和库洛牌；奇遇选择会延续事件链并积累人物关系'
    - icon: help-icon_46
      title: '#库洛牌组合 [卡牌1] [卡牌2] [卡牌3]'
      desc: '编组三张已封印库洛牌，激活疾风封印、元素共鸣、月华守护或梦境回廊'
    - icon: help-icon_46
      title: '#小樱进阶'
      desc: '满足境界、库洛牌与熟练度要求后，依次进阶星之杖和梦之杖形态'
    - icon: help-icon_46
      title: '#月之审判 / #梦之试炼'
      desc: '挑战小樱两阶段进阶试炼；月华守护可提高月之审判成功率，失败两次后触发保底'

- group: 见泷原与鹿目圆
  list:
    - icon: help-icon_47
      title: '#见泷原 / #探索见泷原 [地点]'
      desc: '探索魔女结界并经历时间线事件；选择会改变人物关系、希望、污浊与因果进度'
    - icon: help-icon_47
      title: '#净化灵魂宝石'
      desc: '消耗悲叹之种降低灵魂宝石污浊度，并获得净化绝望进度'
    - icon: help-icon_47
      title: '#重置见泷原时间线'
      desc: '污浊度达到要求后消耗镜能主动重置时间线，积累时间线干涉'
    - icon: help-icon_47
      title: '#魔法少女进阶'
      desc: '依次进阶许愿者·圆、希望之光·圆和圆神，境界与希望系统条件均需满足'
    - icon: help-icon_47
      title: '#救赎 / #救赎 @玩家'
      desc: '装载鹿目圆系化身后，以希望之力救赎自身或指定玩家'

- group: 骑士世界与帝骑
  list:
    - icon: help-icon_48
      title: '#骑士世界 / #探索骑士世界 [地点]'
      desc: '巡游并收集驱动器、主骑卡与触屏碎片；奇遇选择会改变关系、共鸣和融合危机'
    - icon: help-icon_48
      title: '#编组骑士卡片 [卡片1] [卡片2] [卡片3]'
      desc: '从已收录主骑中选择三张出战卡，决定帝骑战斗技能池与终结技'
    - icon: help-icon_48
      title: '#最终攻击驾驭'
      desc: '世界融合度达到60后发动三卡终结，压低融合度并化解世界融合危机'
    - icon: help-icon_48
      title: '#终极卡试炼 [强攻/共鸣/守护]'
      desc: '帝骑·神主完成十世界巡游后选择路线，满足境界与路线条件即可进阶终极神主'

- group: 人体秘境体系
