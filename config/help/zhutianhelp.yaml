      title: '#时间线权能 / #因果债'
      desc: '查看备份时间线、古史锚点、因果债、雷罚封禁与当前可用权能；因果债超过200会招来二十道时间长河雷劫'
    - icon: help-icon_2
      title: '#支取时间线 [@玩家/全体] 道具*物品名'
      desc: '准仙帝感知数量并随机支取一条；仙帝推演指定玩家的古史时代；祭道可用@玩家指定目标或用“全体”遍观全服；同级或高境目标仍有本体护持'
