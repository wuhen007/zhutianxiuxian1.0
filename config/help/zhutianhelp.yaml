- group: 人体秘境体系
  list:
    - icon: help-icon_2
      title: '#证道'
      desc: '在额外修炼体系上迈入下一个境界，一境一重天' 
    - icon: help-icon_2
      title: '#渡（斩道|圣人|圣人王|大圣|准帝）雷劫'
      desc: '境界、仙道潜力、修为血气与当前己道均满足要求后，历经雷劫突破'       
    - icon: help-icon_2
      title: '#悟道 / #悟道古茶'
      desc: '斩道王者后消耗寿元参悟当前己道；悟道古茶叶可额外加速；服【大衍悟道丹】可于每日上限后再续一次悟道'
    - icon: help-icon_2
      title: '#我的道途'
      desc: '查看王者道则至无缺帝道的修炼阶段、今日悟道次数与真实寿元'
    - icon: help-icon_2
      title: '#为其护道'
      desc: '在成就斩道王者后，可以为人护道，在被护道者下本死亡时会出现庇护'       
    - icon: help-icon_2
      title: '@qq#庇护应劫'
      desc: '圣体并非无敌，在末法时代进阶四极时有必死之劫，需有另一位大能消耗极大代价为你庇护应劫接续断路'
    - icon: help-icon_2
      title: '#证道成帝'
      desc: '准帝九重天可挑战帝劫：当世无帝时融合天心印记；当世已有大帝时，大成荒古圣体、先天圣体道胎、混沌体、先天混沌圣体道胎可不合天心，凌驾万道成帝！' 
    - icon: help-icon_2
      title: '#自封帝号'
      desc: '成就天帝后，为自己自封帝号受到天地众生敬仰！' 
    - icon: help-icon_2
      title: '#逆活九世'
      desc: '若要迈入仙道领域唯有逆活九世，红尘为仙！'
    - icon: help-icon_2
      title: '#破王成帝'
      desc: '破开王境，踏入准仙帝境界！'       
    - icon: help-icon_2
      title: '#祭道'
      desc: '若要在路尽级仙帝道果上更进一步极尽升华，必先焚烧大道，祭掉自身一切！' 
    - icon: help-icon_2
      title: '#凝聚精血'
      desc: '圣体，神体，先天道胎，混沌体，妖体等等可以凝聚本命精血'       

- group: 仙古今世法体系
  list:
    - icon: help-icon_2
      title: '#冲关/冲关极境'
      desc: '在仙古今世法上迈入下一个境界，并且可以打磨极境' 
    - icon: help-icon_2
      title: '#天神书院 / #申请入院 / #我的院籍'
      desc: '尊者境可在九天十地申请天神书院院籍'
    - icon: help-icon_2
      title: '#院籍晋升'
      desc: '境界与源石满足要求后晋升院籍身份'
    - icon: help-icon_2
      title: '#选择仙院 / #选择圣院'
      desc: '选择一次后续修行分院，当前不可更改'
    - icon: help-icon_2
      title: '#领取书院俸禄'
      desc: '根据院籍身份每日领取源石俸禄'

