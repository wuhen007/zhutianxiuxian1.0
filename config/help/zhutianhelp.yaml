      title: '@qq#庇护应劫'
      desc: '圣体并非无敌，在末法时代进阶四极时有必死之劫，需有另一位大能消耗极大代价为你庇护应劫接续断路'
    - icon: help-icon_2
      title: '#证道成帝 [偏僻无人星系]'
      desc: '准帝九重天可挑战帝劫；可选偏僻星系降低不死不休旧敌感知渡劫声势的概率'
