- group: 小世界经营
  list:
    - icon: help-icon_15
      title: '#开辟小世界 世界名'
      desc: '成仙后消耗世界石创建小世界，例如：#开辟小世界 紫霄界'
    - icon: help-icon_9
      title: '#演化小世界'
      desc: '演化至5级，提升灵气、时间流速、药田和栖息地上限'
    - icon: help-icon_37
      title: '#我的小世界'
      desc: '查看世界资源、药田、仙宠、工坊和近期事件'
    - icon: help-icon_38
      title: '#将分身化入小世界'
      desc: '消耗100万修为开启小世界挂机收集'
    - icon: help-icon_26
      title: '#收获小世界资源'
      desc: '结算最多96个现实小时的资源、成熟作物和仙宠工坊产出'
    - icon: help-icon_37
      title: '#建立败天神殿'
      desc: '开启玉石匣后，消耗2000万源石和15枚世界石建造；每4小时产500万源石与5点功法感悟'
    - icon: help-icon_62
      title: '#使用材料名创造环境'
      desc: '消耗材料永久创建种植环境，如仙泉、龙穴、雷池和仙坟'

- group: 大宇宙与造化秘境
  list:
    - icon: help-icon_44
      title: '#升格大宇宙 / #大宇宙'
      desc: '仙王以已开创的自身之道，将5级小世界升格为不受绝灵时代压制的大宇宙；后者查看宇宙法则'
    - icon: help-icon_44
      title: '#完善宇宙法则*次数'
      desc: '消耗仙道潜力、修为与血气，以自身道行完善宇宙法则；仙王封顶红尘仙，巨头可至帝光仙王'
    - icon: help-icon_44
      title: '#炼化宇宙灵韵 类别*物品名*数量'
      desc: '将纳戒物品炼成宇宙灵韵，例如：#炼化宇宙灵韵 材料*世界石*10'
    - icon: help-icon_44
      title: '#铸造宇宙秘境 秘境名*类别*物品名'
      desc: '消耗一件已有物品与100灵韵，将物品化作可由自己挑战的秘境核心'
    - icon: help-icon_44
      title: '#演绎宇宙秘境 秘境名'
      desc: '准仙帝付出巨大修为、血气、源石与灵韵演绎万物轮回；仙帝享受权能减免'
    - icon: help-icon_44
      title: '#编辑宇宙秘境 秘境名*简介/敌人/奖励*内容'
      desc: '自定义秘境叙事、守界敌人与奖励描述，文本不会改变数值结算'
    - icon: help-icon_44
      title: '#宇宙秘境 / #进入宇宙秘境 秘境名'
      desc: '查看自己的造化秘境并亲自挑战；同一秘境每8小时重启一次轮回'
    - icon: help-icon_57
      title: '诸天维度壁垒'
      desc: '诸天万界→上苍之上→超维宇宙→厄土高原/永恒未知之地→百维真界→原初宇宙海→千维宙古界→万维梵宇界→神维丝线海'

- group: 神药药田
  list:
    - icon: help-icon_13
      title: '#种植指南'
      desc: '查看全部种子、灵气要求和特殊环境要求'
    - icon: help-icon_11
      title: '#小世界栽种种子名'
      desc: '在一块空药田栽种指定神药种子'
    - icon: help-icon_48
      title: '#一键种植[种子名]'
      desc: '不填名称自动种满可用种子，填写名称则只种该种子'
    - icon: help-icon_41
      title: '#一键浇灌普通'
      desc: '免费浇灌全部未成熟作物，减少30分钟生长时间，冷却6小时'
    - icon: help-icon_42
      title: '#使用道具浇灌第N号作物'
      desc: '单株使用草木精华露、岁月流金沙或掌天灵液，减少25%/50%/75%剩余时间'
    - icon: help-icon_45
      title: '#一键浇灌道具名'
      desc: '消耗1件浇灌道具作用于全部作物，并增加收成和返种概率'
    - icon: help-icon_40
      title: '#浇灌小世界作物'
      desc: '消耗乾坤造化瓶，使全部作物剩余生长时间减少25%'

- group: 仙宠工坊
  list:
    - icon: help-icon_39
      title: '#安置仙宠仙宠名'
      desc: '把纳戒仙宠安置到小世界栖息地'
    - icon: help-icon_52
      title: '#小世界工坊'
      desc: '查看工坊岗位、升级材料、仙宠口粮、精力与自动作息状态'
    - icon: help-icon_52
      title: '#升级小世界工坊 工坊名'
      desc: '消耗矿脉产出的界源矿石和器阁产出的工坊构件升级；五档基础收集时间为72/120/240/360/480个小世界等效小时'
    - icon: help-icon_53
      title: '#分配仙宠甲到工坊名'
      desc: '可分配到灵田、丹房、器阁、符台或矿脉；类型匹配效率更高'
    - icon: help-icon_68
      title: '#召回休息仙宠名'
      desc: '停止仙宠工作，让它回栖息地恢复精力；#处理分配仙宠名效果相同'
    - icon: help-icon_43
      title: '#召回仙宠仙宠名'
      desc: '把仙宠从小世界栖息地收回纳戒'
    - icon: help-icon_26
      title: '工坊产出'
      desc: '灵田产修为、血气、制符草药和口粮；丹房炼专属神药；器阁产矿石与工坊构件；符台产符纸；矿脉产灵石、源石和界源矿石'
    - icon: help-icon_26
      title: '仙宠自动生活'
      desc: '工作中的仙宠每24小时劳作14小时、休息7小时、玩耍3小时并进食；优先吃灵田口粮，缺粮时会消耗本次或纳戒中的仙馐果、混沌元液等食物'

- group: 月华天宫[岁云传承]
  list:
    - icon: help-icon_57
      title: '#岁云之力 / #收获小世界资源'
      desc: '岁云一脉的小世界自动升华为月华天宫，每现实小时产出0.5岁云之力；无需分身即可结算'

- group: 诸界互动
  list:
    - icon: help-icon_57
      title: '#小世界偷菜 [@玩家]'
      desc: '不艾特随机寻找目标；冷却12小时，被偷世界受保护6小时且不损失基础收成'
    - icon: help-icon_69
      title: '#设置仙宠守卫仙宠名'
      desc: '让休息中的栖息地仙宠拦截偷菜，遭遇时会消耗精力'
    - icon: help-icon_31
      title: '#小世界守卫 / #撤下仙宠守卫'
      desc: '查看当前守卫状态，或撤下守卫返回栖息地休息'
    - icon: help-icon_86
      title: '#驯服仙兽'
      desc: '收获时可能遭遇野生仙兽；30分钟内消耗封灵符尝试驯服'
