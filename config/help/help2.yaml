- group: 一键功能
  list:
    - icon: help-icon_2
      title: '#一键服用修为丹/血气丹/神药/天药/食材'
      desc: '顾名思义，无需多言' 
    - icon: help-icon_2
      title: '#一键卖矿石/卖钞票/回血/学习/装备/解锁/锁定'
      desc: '剩余的无需赘述' 

- group: 位面穿梭
  list:
    - icon: help-icon_2
      title: '#穿梭凡间/仙界/下界八域/遮天位面/九天十地/仙域/时间长河/永恒未知之地'
      desc: '肉身横渡星海，耗时最长（每级约15分钟），随秘境/仙古境界提升而递减；鲲鹏法仅缩短耗时。需先记坐标' 
    - icon: help-icon_2
      title: '#消耗位面传送阵'
      desc: '消耗位面传送次数走传送阵，仍需时间且低级阵易遇虚空乱流，需先在阵上刻画该位面坐标；大位面传送阵=3次'
    - icon: help-icon_2
      title: '#记坐标 @位面名'
      desc: '消耗1枚星图，将目标位面坐标记入个人记忆星图（除凡间外，穿梭/接引/送往均需已知坐标）'
    - icon: help-icon_2
      title: '#刻画坐标 @位面名'
      desc: '消耗5000万灵石，在传送阵上刻画该位面坐标（需已记坐标）；未刻画则传送阵无法前往该位面'
    - icon: help-icon_2
      title: '#激活五色祭坛'
      desc: '消耗修为血气激活五色祭坛（圣人以下前往遮天位面的手段），激活即记下遮天坐标，可免#记坐标直抵遮天'               
    - icon: help-icon_2
      title: '#接引 @目标 / #送往 @目标 @位面'
      desc: '最便捷手段：仙王需自身已知双方坐标，目标须60秒内 #同意接引 确认，可 #拒绝接引'

- group: 位面大事件
  list:
    - icon: help-icon_2
      title: '#大事件'
      desc: '查看正在发生的大事件、具体位面坐标、剩余时间与参与指令'
    - icon: help-icon_2
      title: '#前往x,y'
      desc: '抵达当前位面的指定坐标，位面与坐标完全吻合后方可参与事件'
    - icon: help-icon_2
      title: '#参与位面大事件'
      desc: '参与当前位置的普通大事件；先天至宝出世使用独立的24小时择主玩法'
    - icon: help-icon_2
      title: '#观摩灵宝 / #夺宝 / #查看夺宝进度'
      desc: '抵达至宝坐标后报名，从守护灵、先天禁制、天地灵脉、命运乱流中选择三种试炼'
    - icon: help-icon_2
      title: '#立下道心 选择 / #灵宝择主榜'
      desc: '完成三种试炼后立下道心；事件结束按试炼、性情契合、破封贡献和天运公开择主'
    - icon: help-icon_2
      title: '#执掌先天至宝 名称'
      desc: '将已认主的至宝本体或七日投影置入帝兵位，不与原有#装备指令混用'
    - icon: help-icon_2
      title: '#进入万相魔冢 / #探索位面线索 地点'
      desc: '参与对应的专属位面事件，同样需要先抵达事件精确坐标'
    - icon: help-icon_2
      title: '#白须仙翁 / #购买仙翁商品*编号'
      desc: '抵达白须仙翁所在的位面坐标后，查看并用源石购买全服唯一的百分比装备'
    - icon: help-icon_2
      title: '#黑衣神秘人 / #购买黑市商品*编号'
      desc: '抵达黑衣神秘人所在的位面坐标后，查看并用源石购买神药、潜力丹与诸天禁物'
    - icon: help-icon_2
      title: '#绝美仙子 / #求取问道签|历练签|寻缘签'
      desc: '抵达绝美仙子所在坐标后，花费200万源石三选一获得24小时红尘仙缘签效果'

- group: 生命之轮
  list:
    - icon: help-icon_2
      title: '#修复道伤'
      desc: '用无上疗伤功法以一定代价修复自身道伤' 
    - icon: help-icon_2
      title: '#服用xxx/一键服用神药'
      desc: '用神药的药性修复道伤，但消耗的药力极其庞大' 
    - icon: help-icon_2
      title: '#修复生命本源'
      desc: '用一定代价修复缺失的生命本源' 

- group: 道家黄庭内景地
  list:
    - icon: help-icon_2
      title: '#凝练元神'
      desc: '以一定元神值凝炼元神等级，与秘境体系/仙古今世法等级挂钩'   
    - icon: help-icon_2
      title: '#开启内景地'
      desc: '消耗五百万元神值开启内景地，成功率与元神等级挂钩' 
    - icon: help-icon_2
      title: '#进入内景地'
      desc: '进入内景地修复道伤，获得大量修血，量值与自身等级挂钩' 
    - icon: help-icon_2
      title: '#开辟内景地空间'
      desc: '消耗五百万元神值开辟内景地空间，相当于仓库'
    - icon: help-icon_2
      title: '#升级内景地空间'
      desc: '消耗一定源石升级内景地空间存储上限'
    - icon: help-icon_2
      title: '#存xx*数量||#取xx*数量||一键存入内景地||一键取出内景地||查看内景地'
      desc: '顾名思义,无需多言'                





