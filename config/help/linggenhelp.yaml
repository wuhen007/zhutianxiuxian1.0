      title: '#岁云之力 兑换 10000'
      desc: '每10000月华转化0.1岁云之力，数量可用10000的正整数倍'
    - icon: help-icon_2
      title: '#岁云更改 时代 时代名 / #岁云更改 至宝线索'
      desc: '更改时代消耗5点，引发未认主先天至宝线索消耗10点'
    - icon: help-icon_2
      title: '#岁云更改 命格|天资|灵根 名称 [@玩家]'
      desc: '改写自身或目标消耗20点；岁云唯一传承不进入自由改写池'

