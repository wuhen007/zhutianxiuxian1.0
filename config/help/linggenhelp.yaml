- group: 记忆命途[黄金因子与泰坦见证]
  list:
    - icon: help-icon_2
      title: '#记忆因子'
      desc: '查看因子与模拟进度；数据觉醒、星神天资、诗篇、棱镜碎片、六相冰封和星神觐见已暂停'
    - icon: help-icon_2
      title: '#命途模拟 / #命途行进'
      desc: '非逃离秘境每次结算积累2%模拟值，满100抽不重复因子；四阶上限3/6/9/12，最高无漏净子，受大能/圣人/大帝门槛约束'
    - icon: help-icon_2
      title: '#逐火之旅 / #行者之旅 / #泰坦试炼'
      desc: '逐火行者每6小时强化一次，完整12次后晋升；半神之体每小时挑战泰坦，胜利完整12次后晋升；因子提前升满后继续巩固剩余见证'
    - icon: help-icon_2
      title: '因子本源与悟道'
      desc: '前两阶每因子本源+10，第三阶起每泰坦+20；初始悟道加成移除，每因子仍悟道+3%、减伤+3%'
    - icon: help-icon_2
      title: '记忆基础效果与黄金件数'
      desc: '逐火行者起基础减伤30%、物品2倍；每6个已获因子让普通物品最终数量+1件，泰坦每3个额外+3倍保留'
    - icon: help-icon_2
      title: '浪漫三件套'
      desc: '逐火套总倍率4倍、泰坦套3倍、星神套10倍，作用攻击/防御/生命；按因子等级领取并完整穿戴'
    - icon: help-icon_2
      title: '门径因子[黄金/强化/泰坦]'
      desc: '副本入场修为、血气、灵石、寿元代价减少20%/30%/40%，整数向上取整；门径不再缩短探索时间'
    # 暂停：记忆碎片、六相冰封、星神觐见、记忆更改、记忆造物、记忆回溯。

- group: 岁云月华[同时间线唯一传承]
  list:
    - icon: help-icon_2
      title: '岁云幸运 / 岁云剑灵 / 秘境通行'
      desc: '五阶自带100%幸运；霜月剑尊起领取仙宠【岁云剑灵】，兼具战斗三维加成与0.4炼器成长，并免秘境入场资源消耗；旧角色用#岁云见证补领'
    - icon: help-icon_2
      title: '#消耗岁云的残念 / #学习月华炼天功'
      desc: '往世星海以0.00001概率掉落唯一残念；觉醒月华之体与岁云天资，获得月华炼天功秘籍，并自动入主【岁云剑宫】位登宫主，同时获授帝经《岁云化月》'
    - icon: help-icon_2
      title: '#引月入体 / #化霜入剑 / #月之见证'
      desc: '月华之体依次完成12次每小时试炼、12道剑试、9场见证；失败保留进度'
    - icon: help-icon_2
      title: '#岁云见证'
      desc: '依境界晋升五阶；霜月剑尊得霜月三件套，齐套攻防生命10倍；最终获得岁云套20倍与无上天阙枝'
    - icon: help-icon_2
      title: '霜剑入月[灵根自带]'
      desc: '五阶段共有：最多9敌、每敌9击、每击25倍；绝控推条霜寒；生命低于15%直接斩杀且禁止复活'
    - icon: help-icon_2
      title: '岁云归一[灵根自带]'
      desc: '五阶段共有：防御减伤50%，反弹实际承伤的100%；反伤不连锁，不占技能槽'
    - icon: help-icon_2
      title: '白云苍狗 / #我的战斗技能'
      desc: '五阶段共有：每战3次复活，每次攻防生命上限速度×1.5，三次累计×3.375；四战技无需另学，战斗结束不保留临时增幅'
    - icon: help-icon_2
      title: '岁云常青 / 绝灵免疫'
      desc: '常青为五阶本人自带第四技能：常驻基础速度+200，免疫即死、禁复活和禁疗；讨伐天骄单次至多斩落40%气血；全系列免绝灵侵蚀和寿元压制，受赐者仅获原三技'
    - icon: help-icon_2
      title: '岁云PVP·同境裁决'
      desc: '五阶真人对战：对手额外体系等效境界若更高，本场压到自己同境，先于境界天堑；跨秘境/仙古/花粉生效，PVE与存档境界不变'
    - icon: help-icon_2
      title: '#岁岁年年 [材料/潜力丹/封灵符/心神丹]'
      desc: '每现实小时1件，封灵符对应普通封灵符；支持#岁岁年年 祈愿 封灵符/心神丹，和仙金功法祈愿共用冷却'
    - icon: help-icon_2
      title: '月华通行·无尽劫境'
      desc: '五阶段本人进无尽免秘钥与心神，不占周末免费次数；本服、跨服与扫荡均适用，扫荡券仍需消耗，普通队友与受赐者不继承'
    - icon: help-icon_2
      title: '岁云剑灵·战斗/炼器/炼丹'
      desc: '霜月剑尊赠宠，同时保留战斗三维、炼器成长0.4与炼丹附加值0.4；旧宠用#岁云之力或#岁云见证补齐，不重发、不覆盖炼妖继承'
    - icon: help-icon_2
      title: '#岁岁年年 祈愿 临字秘 / #岁岁年年 祈愿 九秘'
      desc: '指定临/兵/斗/者/皆/数/组/前/行字秘之一，或随机九秘一本秘籍；祈愿 十凶宝术 随机一族宝术，写全名可取指定；与原岁岁年年共用现实1小时冷却，仍需正常学习'
    - icon: help-icon_2
      title: '#刻舟求剑'
      desc: '岁云五阶专属岁云殿堂，免入场消耗；低级群星圣药，中级岁月的馈赠，高级潜力丹/大衍悟道丹/悟道古茶叶'
    - icon: help-icon_2
      title: '#朝花夕拾 / #朝花夕拾*1'
      desc: '沉迷岁云殿堂，每组10轮，支持1～12组，省略数量1组；五阶段均可从当前位面出发，免钥匙、灵石、寿元消耗'
    - icon: help-icon_2
      title: '岁月的馈赠'
      desc: '每颗10次探索：出金率+50个百分点，胜利另有50%概率额外获得隐藏奇遇物品；单次、沉迷和法身实际轮次结算，重试不重复抽发'
    - icon: help-icon_2
      title: '#月华垂钓'
      desc: '岁云五阶群内消耗3点岁云之力必出鱼王并自动入队，无鱼钩饵料消耗；已有鱼王、正在鱼王队伍或创建中断不扣费'
    - icon: help-icon_2
      title: '#赐予月华 @目标 / #赐予月华'
      desc: '岁云五阶段均可赐予三战技；全服最多3人永久占席，无@查看。仅三技，不转授、不随召唤物复制，受赐后切化身保留'
    - icon: help-icon_2
      title: '#月华锁魂'
      desc: '岁云全系列自带，搜魂已击败待处置的天骄必定成功，无神魂自爆；获取一门未学功法，已全学则转为元神'
    - icon: help-icon_2
      title: '月华仙炉 / #一键完美开炉'
      desc: '岁云转职炼器师自动安装月华仙炉并点燃大空火种，旧炼器师用#炼器师能力评测补领；每次消耗1000月华完美开炉'
    - icon: help-icon_2
      title: '#月华炼化 @玩家 / 天骄 / 灾厄 / 魔主'
      desc: '需习得月华炼天功；玩家战胜后无视天空因子、本源保护和弱者保护炼化；天骄灾厄仍需真实胜利凭证；每份获100～300月华，自身冷却保留'
    - icon: help-icon_2
      title: '灾厄 / 魔主炼化额外收益'
      desc: '修为血气各+2%、元神+1%，本源仍按天魔抽取算法；仙道潜力=炼化前本源上限×5%，本源封顶仍可得，岁云剑尊每份750；不乘灾厄权重或掉落倍率，不加魔道'
    - icon: help-icon_2
      title: '#云月之莲'
      desc: '每累计炼化1月华，装备莲花时攻防生命上限各固定+20万；仅炼化计入，日修炼不计，消耗月华不掉成长；查看累计与生效状态'
    - icon: help-icon_2
      title: '#云月修炼 / #岁云之力'
      desc: '每日修炼2000～5000月华；天宫每现实小时50仙道潜力，岁云化身起另产0.5岁云之力×世界时间流速，晋升前不补发'
    - icon: help-icon_2
      title: '#剑宫兑换 / #岁云剑宫商店 / #剑宫商店'
      desc: '显示岁云剑宫商店UI，列出宫主源石余额、物品价格与可兑换状态；#剑宫兑换 物品名*数量 继续兑换'
    - icon: help-icon_2
      title: '岁云传承保护 / 岁云化身减伤'
      desc: '仙帝重塑灵根不赋予或覆盖岁云五阶段；岁云化身渡劫减伤75%，岁云剑尊仍为85%'
    - icon: help-icon_2
      title: '#月华兑换100 / #岁云之力 兑换 100'
      desc: '每100月华兑换1仙道潜力，数量为100的正整数倍；不再换岁云之力，消费不减云月之莲累计成长'
    - icon: help-icon_2
      title: '#岁云造物 物品名'
      desc: '仅岁云剑尊本源；每次10岁云之力造1件入本人纳戒，名称可紧贴指令。稀有度不限，仍受不可创造、唯一及本命归属约束，不填数量或@他人'
    - icon: help-icon_2
      title: '#岁云更改 时代 时代名 / #岁云更改 至宝线索'
      desc: '霜月剑尊及后续阶段开放；更改时代消耗5点，引发未认主先天至宝线索消耗10点'
    - icon: help-icon_2
      title: '#岁云更改 命格|天资|灵根 名称 [@玩家]'
      desc: '霜月剑尊及后续阶段开放，改写自身或目标消耗20点；岁云唯一传承不进入自由改写池'

