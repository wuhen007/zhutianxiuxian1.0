- group: 众生仙钓
  list:
    - icon: help-icon_44
      title: '#垂纶（原#垂钓签到/#仙钓签到）'
      desc: '每日垂纶诸天界河，领取众生仙钓与1~3个随机仙饵，连续第7日潮头加赠'
    - icon: help-icon_44
      title: '#众生仙饵'
      desc: '查看五种仙饵及对应的定向渔获'
    - icon: help-icon_44
      title: '#垂钓众生 仙饵名'
      desc: '消耗众生仙钓与指定仙饵垂钓，获得愿鳞并可能触发位面奇遇'
    - icon: help-icon_44
      title: '#愿鳞兑换 / #愿鳞兑换 物品名*份数'
      desc: '默认1份，批量也支持“物品名 份数”；按每份价格和产量结算，如宇宙核心*3消耗240愿鳞得15个。限购物品仍仅可单份兑换'
    - icon: help-icon_44
      title: '#众生鱼图鉴 / #众生鱼图鉴 全部'
      desc: '查看当前位面鱼谱、鱼王记录与诸天收集总进度'
