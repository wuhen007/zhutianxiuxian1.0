      title: '#鱼王列表 / #鱼王状态 / #加入鱼王讨伐 / #讨伐鱼王'
      desc: '列表查看全服鱼王并按编号跨群加入；讨伐不受位面、下本或自身血量限制，击杀后随机分配一件诸天遗珍'
