      title: '#领取鱼图鉴奖励'
      desc: '领取发现与集齐奖励；位面鱼谱集齐一套兑换5众生仙钓+10愿鳞，并消耗每种渔获各1条'
    - icon: help-icon_44
      title: '#万界潮汐 / #垂钓奇遇 1'
      desc: '查看五千年潮汐周期，处理垂钓时触发的位面选择奇遇'
